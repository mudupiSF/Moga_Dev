<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDD (Post Disbursement Documents) – Screen Mockups</title>
  <style>
    :root {
      --navy-950: #0b1630;
      --navy-900: #13213d;
      --navy-850: #18284a;
      --navy-800: #1f3258;
      --blue-600: #1d6fd8;
      --blue-100: #e3eefc;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f6f8fb;
      --green-600: #16a34a;
      --green-100: #dcfce7;
      --amber-700: #b45309;
      --amber-100: #fef3c7;
      --red-600: #dc2626;
      --red-100: #fee2e2;
      --white: #fff;
      --font: "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); font-size: 13px; color: var(--slate-900); background: #d9dfe8; }
    button, input, select, textarea { font: inherit; }

    /* Reviewer toolbar (not part of the product UI) */
    .all-title { margin: 28px 0 10px; padding: 6px 12px; background: #fff7e6; border-left: 4px solid #f0a020; font-weight: 700; font-size: 15px; }
    .all-title:first-child { margin-top: 0; }
    .review-bar { background: #fff7e6; border-bottom: 1px solid #f3d08a; padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
    .review-bar strong { color: var(--amber-700); }
    .review-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .review-group span { color: var(--slate-600); margin-right: 2px; }
    .seg { border: 1px solid var(--slate-300); background: var(--white); padding: 3px 9px; border-radius: 4px; cursor: pointer; }
    .seg.on { background: var(--navy-900); color: var(--white); border-color: var(--navy-900); }

    /* App shell (matches MOGA LOS) */
    .app { max-width: 1280px; margin: 12px auto; background: var(--slate-50); box-shadow: 0 6px 24px rgba(15,23,42,.18); }
    .topnav { height: 46px; background: var(--white); display: flex; align-items: center; padding: 0 14px; gap: 22px; border-bottom: 1px solid var(--slate-200); }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .logo-mark { width: 26px; height: 26px; border-radius: 5px; background: var(--blue-600); color: var(--white); display: grid; place-items: center; font-size: 12px; }
    .topnav a { color: var(--slate-700); text-decoration: none; padding: 13px 4px; }
    .topnav a.active { color: var(--blue-600); border-bottom: 2px solid var(--blue-600); }
    .topnav .spacer { flex: 1; }
    .util { display: flex; gap: 12px; align-items: center; color: var(--slate-500); }
    .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--blue-600); color: var(--white); display: grid; place-items: center; font-weight: 700; }

    .app-header { background: var(--navy-900); color: var(--white); padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; }
    .app-header h1 { font-size: 14px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .name-chip { background: #34425f; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
    .app-header .meta { color: #a9b8d6; font-size: 11px; margin-top: 2px; }
    .hdr-actions { display: flex; gap: 8px; align-items: center; }
    .btn-dark { background: #2b3a5a; color: var(--white); border: 1px solid #4a5a7c; padding: 5px 12px; border-radius: 4px; font-weight: 600; font-size: 11px; }

    .layout { display: grid; grid-template-columns: 210px 1fr; min-height: 720px; }
    .sidebar { background: var(--navy-950); color: #c9d4ea; padding: 10px 0; font-size: 12px; }
    .progress-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 12px; font-weight: 600; color: var(--white); }
    .ring { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--green-600); display: grid; place-items: center; font-size: 10px; color: #7ee2a0; }
    .grp { padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; color: #8d9bb8; font-weight: 600; letter-spacing: .02em; }
    .grp.open { color: var(--white); }
    .tick { width: 15px; height: 15px; border-radius: 50%; background: var(--green-600); color: var(--white); display: grid; place-items: center; font-size: 9px; }
    .item { padding: 7px 14px 7px 22px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
    .item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-600); }
    .item .dot.todo { background: #5b6b8c; }
    .item.active { background: var(--navy-850); color: var(--white); }
    .item.active .dot { background: #4da3ff; }

    .main { padding: 16px 18px 28px; }
    .card { background: var(--white); border: 1px solid var(--slate-200); border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
    .card-hd { background: var(--navy-900); color: var(--white); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card-hd .ttl { display: flex; align-items: center; gap: 10px; }
    .ico { width: 30px; height: 30px; border-radius: 4px; background: #2d3d60; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
    .card-hd h2 { font-size: 13px; margin: 0; letter-spacing: .02em; }
    .card-hd p { margin: 2px 0 0; color: #a9b8d6; font-size: 11px; }
    .card-bd { padding: 14px; }
    .sub-hd { padding: 10px 14px; border-bottom: 1px solid var(--slate-200); background: var(--slate-50); display: flex; justify-content: space-between; align-items: center; }
    .sub-hd h3 { margin: 0; font-size: 13px; }
    .muted { color: var(--slate-500); font-size: 11px; }
    .btn { border: 1px solid var(--slate-300); background: var(--white); color: var(--slate-900); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; }
    .btn.primary { background: var(--blue-600); border-color: var(--blue-600); color: var(--white); }
    .btn.danger { color: var(--red-600); border-color: #f2b8b8; }
    .btn.success { background: var(--green-600); border-color: var(--green-600); color: var(--white); }
    .btn[disabled] { opacity: .45; cursor: not-allowed; }
    .btn.white { background: var(--white); color: var(--slate-900); }
    .link { color: var(--blue-600); cursor: pointer; font-weight: 600; }

    .bar { height: 6px; background: var(--slate-200); border-radius: 3px; overflow: hidden; width: 140px; }
    .bar > i { display: block; height: 100%; background: var(--blue-600); }

    .tranche-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
    .tranche { border: 1px solid var(--slate-200); border-radius: 6px; padding: 12px; display: flex; gap: 12px; }
    .tranche .num { width: 34px; height: 34px; border-radius: 4px; background: var(--slate-100); display: grid; place-items: center; font-weight: 700; font-size: 11px; }
    .tranche h4 { margin: 0 0 2px; font-size: 13px; }
    .amt { color: var(--blue-600); font-weight: 600; font-size: 11px; margin-top: 3px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .b-green { background: var(--green-100); color: #166534; }
    .b-amber { background: var(--amber-100); color: var(--amber-700); }
    .b-red { background: var(--red-100); color: #991b1b; }
    .b-blue { background: var(--blue-100); color: #1e4f99; }
    .b-grey { background: var(--slate-100); color: var(--slate-600); }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; color: var(--slate-500); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--slate-200); background: var(--slate-50); }
    td { padding: 9px 10px; border-bottom: 1px solid var(--slate-100); vertical-align: middle; }
    tr.mismatch td { background: #fff5f5; }

    .asset-hd { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--slate-50); border-bottom: 1px solid var(--slate-200); }
    .asset-hd b { font-size: 13px; }

    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; }
    .field label { display: block; font-size: 11px; color: var(--slate-600); margin-bottom: 4px; font-weight: 600; }
    .field label .req { color: var(--red-600); }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--slate-300); border-radius: 4px; padding: 6px 8px; background: var(--white); }
    .field input[readonly] { background: var(--slate-100); color: var(--slate-700); }
    .inline { display: flex; gap: 8px; align-items: flex-end; }
    .inline .field { flex: 1; }

    .alert { border-radius: 5px; padding: 10px 12px; margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; }
    .alert.err { background: var(--red-100); border: 1px solid #f5b5b5; color: #7f1d1d; }
    .alert.ok { background: var(--green-100); border: 1px solid #a7e3bb; color: #14532d; }
    .alert.warn { background: var(--amber-100); border: 1px solid #f0cf8a; color: #78350f; }
    .alert.info { background: var(--blue-100); border: 1px solid #b9d3f6; color: #1e3a8a; }

    .uploads { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .upload { border: 1px dashed var(--slate-300); border-radius: 6px; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .upload .file { font-size: 11px; color: var(--slate-600); margin-top: 3px; }

    .footer-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--slate-200); background: var(--slate-50); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .crumb { margin-bottom: 10px; font-size: 12px; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--slate-200); padding: 0 14px; background: var(--white); }
    .tab { padding: 10px 14px; cursor: pointer; color: var(--slate-600); font-weight: 600; border-bottom: 2px solid transparent; }
    .tab.on { color: var(--blue-600); border-bottom-color: var(--blue-600); }
    .decision { display: flex; gap: 10px; margin-bottom: 10px; }
    .decision label { border: 1px solid var(--slate-300); border-radius: 5px; padding: 8px 14px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
    .decision label.sel-approve { border-color: var(--green-600); background: var(--green-100); }
    .decision label.sel-return { border-color: var(--red-600); background: var(--red-100); }

    /* Annotations */
    .tag { display: none; font-family: Consolas, monospace; font-size: 10px; color: #7c3aed; background: #f3e8ff; border: 1px dashed #c4b5fd; padding: 1px 6px; border-radius: 3px; margin: 0 0 6px; width: fit-content; }
    .annot .tag { display: block; }
    .annot .tag.inline-tag { display: inline-block; margin: 0 0 0 6px; }
    .api { display: none; font-family: Consolas, monospace; font-size: 10px; color: #7c3aed; }
    .annot .api { display: block; }
    .pending-note { display: none; }
    .annot .pending-note { display: flex; }
  </style>
</head>
<body>

<div class="review-bar" id="reviewBar"></div>

<div class="app" id="app">
  <div class="topnav">
    <div class="logo"><div class="logo-mark">M</div>MOGA</div>
    <a href="#">Home</a>
    <a href="#" class="active">Applications ▾</a>
    <div class="spacer"></div>
    <div class="util">⭐ ＋ ？ ⚙ 🔔 <div class="avatar" id="avatar">S</div></div>
  </div>

  <div class="app-header">
    <div>
      <h1>Application Overview <span class="name-chip">▸ RAJESH KAPOOR</span></h1>
      <div class="meta"># APP-2026-094521 | Vehicle | <span id="productLabel">Auto</span> | Disbursed</div>
    </div>
    <div class="hdr-actions">
      <button class="btn-dark">⏸ PAUSE</button>
      <span style="color:#a9b8d6">↺ 👤 ⧉ ▦</span>
    </div>
  </div>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<script>
const state = {
  screen: "tranches",
  product: "Auto",
  assetType: "Registrable",
  vahan: "success",
  fc: "success",
  decision: "approve",
  poolTab: "pool",
  annot: false
};

const SCREENS = [
  ["tranches", "1. PDD Maker – Tranches"],
  ["tranche", "2. PDD Maker – Tranche 01"],
  ["rc", "3. RC PDD (Maker)"],
  ["invins", "4. Invoice & Insurance PDD (Maker)"],
  ["pool", "5. PDD Checker – Pool"],
  ["review", "6. PDD Checker – RC Review"]
];

const isChecker = () => state.screen === "pool" || state.screen === "review";

function seg(group, value, label) {
  return `<button class="seg ${state[group] === value ? "on" : ""}" data-group="${group}" data-value="${value}">${label}</button>`;
}

function renderReviewBar() {
  document.getElementById("reviewBar").innerHTML = `
    <strong>Mockup controls</strong>
    <div class="review-group"><span>Screen:</span>${SCREENS.map(([v, l]) => seg("screen", v, l)).join("")}${seg("screen", "all", "All screens")}</div>
    <div class="review-group"><span>Product:</span>${seg("product", "Auto", "Auto")}${seg("product", "CE/CV", "CE/CV")}</div>
    <div class="review-group"><span>Asset:</span>${seg("assetType", "Registrable", "Registrable")}${seg("assetType", "Non-Registrable", "Non-Registrable")}</div>
    <div class="review-group"><span>Vahan API:</span>${seg("vahan", "success", "Success")}${seg("vahan", "failed", "Failed")}</div>
    <div class="review-group"><span>FC API:</span>${seg("fc", "success", "Success")}${seg("fc", "failed", "Failed")}</div>
    <div class="review-group"><span>Annotations:</span>${seg("annot", false, "Off")}${seg("annot", true, "On")}</div>`;
}

function renderSidebar() {
  const items = [["tranches", "PDD Maker", ["tranches", "tranche", "rc", "invins"]], ["pool", "PDD Checker", ["pool", "review"]]];
  document.getElementById("sidebar").innerHTML = `
    <div class="progress-row">Journey Progress <div class="ring">96%</div></div>
    <div class="grp open">▾ POST DISBURSEMENT</div>
    ${items.map(([target, label, group]) => `
      <div class="item ${group.includes(state.screen) ? "active" : ""}" data-nav="${target}">
        <span class="dot ${group.includes(state.screen) ? "" : "todo"}"></span>${label}
      </div>`).join("")}
    <div class="tag" style="margin:10px 12px">[Existing: losSidebar – new group 'POST DISBURSEMENT' with PDD Maker / PDD Checker]</div>`;
}

const CHECKLISTS = {
  a1: { lan: "LAN 0042 0101 0008 7654", veh: "Tata Motors · Nexon · XZ Plus", rc: "Returned", inv: "Completed", ins: "With Checker" },
  a2: { lan: "LAN 0042 0101 0008 7655", veh: "Tata Motors · Nexon · XM", rc: "Pending", inv: "With Checker", ins: "Pending" }
};

function statusBadge(s) {
  const map = { "Completed": "b-green", "With Checker": "b-blue", "Returned": "b-red", "Pending": "b-grey", "FC API Failed": "b-amber" };
  return `<span class="badge ${map[s] || "b-grey"}">${s}</span>`;
}

function rcCopyRule() {
  if (state.vahan === "failed") return { req: true, text: "Mandatory – RC details entered manually after Vahan failure" };
  if (state.product === "CE/CV") return { req: true, text: "Mandatory for CE/CV" };
  return { req: false, text: "Optional for Auto" };
}

function ackRule() {
  return state.assetType === "Non-Registrable"
    ? { req: true, text: "Mandatory for non-registrable asset" }
    : { req: false, text: "Optional for registrable asset" };
}

const VAHAN_ROWS = [
  ["Engine No", "K15CN9182736", "K15CN9182736", "Asset__c.Engine_number__c", true],
  ["Chassis No", "MAT612345KLM09876", "MAT612345KLM09876", "Asset__c.Chassis_number__c", true],
  ["Make", "TATA MOTORS LTD", "Tata Motors", "Asset__c.Make_Name__c", true],
  ["Model", "NEXON", "Nexon", "Asset__c.Model_Name__c", true],
  ["Variant", "XZ PLUS PETROL", "XZ Plus", "Asset__c.Variant_Name__c", false],
  ["Financier Details", "MOGA BANK LTD", "Moga Bank Ltd (lender)", "Journey source to be confirmed", true]
];

function vahanTable(editableNote) {
  return `
    <div class="tag">[LWC (new): vahanComparisonTable – layout similar to Dedupe screen]</div>
    <table>
      <thead><tr><th>Details</th><th>Vahan API</th><th>Existing data in journey</th><th>Status</th></tr></thead>
      <tbody>
        ${VAHAN_ROWS.map(([d, v, j, api, m]) => `
          <tr class="${m ? "" : "mismatch"}">
            <td><b>${d}</b></td>
            <td>${v}</td>
            <td>${j}<span class="api">${api}</span></td>
            <td>${m ? '<span class="badge b-green">Matched</span>' : '<span class="badge b-red">No Match</span>'}</td>
          </tr>`).join("")}
      </tbody>
    </table>
    <div class="alert info pending-note" style="margin-top:10px">ⓘ Open items: matching rule (exact / case-insensitive / partial) and whether a No Match blocks submission or approval are to be confirmed. ${editableNote || ""}</div>`;
}

function uploadTile(title, rule, fileName, checker) {
  return `
    <div class="upload">
      <div>
        <b>${title}</b> ${rule.req ? '<span style="color:var(--red-600)">*</span>' : ""}
        <div class="muted">${rule.text}</div>
        ${fileName ? `<div class="file">📄 ${fileName}</div>` : '<div class="file">No file uploaded</div>'}
      </div>
      ${checker
        ? (fileName ? '<button class="btn">👁 View</button>' : "")
        : `<button class="btn">${fileName ? "Replace" : "⤒ Upload"}</button>`}
    </div>`;
}

/* ---------- Screen 1: Tranches ---------- */
function screenTranches() {
  return `
    <div class="card">
      <div class="card-hd">
        <div class="ttl"><div class="ico">PD</div><div><h2>POST DISBURSEMENT DOCUMENTS (PDD)</h2><p>Complete RC, Invoice and Insurance PDD for each asset of a disbursed tranche</p></div></div>
      </div>
      <div class="tag" style="margin:8px 14px 0">[LWC (new): pddTrancheSummary]</div>
      <div class="sub-hd">
        <div><h3>2 tranches disbursed</h3><div class="muted">4 assets · 1 of 12 checklists completed</div></div>
        <div class="bar"><i style="width:8%"></i></div>
      </div>
      <div class="card-bd">
        <div class="tranche-grid">
          <div class="tranche">
            <div class="num">01</div>
            <div style="flex:1">
              <h4>Tranche 01 <span class="badge b-green">Disbursed 12 Oct 2026</span></h4>
              <div class="muted">2 vehicles · Created 05 Oct 2026</div>
              <div class="amt">Disbursement Amount: ₹19,00,000</div>
            </div>
            <div><button class="btn primary" data-nav="tranche">Open</button></div>
          </div>
          <div class="tranche">
            <div class="num">02</div>
            <div style="flex:1">
              <h4>Tranche 02 <span class="badge b-green">Disbursed 20 Oct 2026</span></h4>
              <div class="muted">2 vehicles · Created 15 Oct 2026</div>
              <div class="amt">Disbursement Amount: ₹18,50,000</div>
            </div>
            <div><button class="btn">Open</button></div>
          </div>
        </div>
      </div>
    </div>`;
}

/* ---------- Screen 2: Tranche detail ---------- */
function assetBlock(key, idx) {
  const a = CHECKLISTS[key];
  const row = (name, status, target) => `
    <tr>
      <td><b>${name}</b></td>
      <td>${statusBadge(status)}</td>
      <td>${status === "With Checker" ? "Central Loan Servicing Pool" : status === "Completed" ? "—" : "Amit Verma (Sales)"}</td>
      <td class="muted">${status === "Returned" ? "Priya Nair (PDD Checker) · 22 Oct 2026" : status === "Completed" ? "Priya Nair (PDD Checker) · 21 Oct 2026" : status === "With Checker" ? "Amit Verma (Sales) · 21 Oct 2026" : "—"}</td>
      <td style="text-align:right">
        ${status === "Completed" || status === "With Checker"
          ? `<button class="btn" data-nav="${target}">View</button>`
          : `<button class="btn primary" data-nav="${target}">${status === "Returned" ? "Rework" : "Open"}</button>`}
      </td>
    </tr>`;
  return `
    <div class="card">
      <div class="asset-hd">
        <div><b>Asset ${idx} · ${a.lan}</b><div class="muted">${a.veh} · ${state.assetType} asset</div></div>
      </div>
      <table>
        <thead><tr><th>Checklist</th><th>Status</th><th>Owner</th><th>Last modified by</th><th></th></tr></thead>
        <tbody>
          ${row("RC PDD", a.rc, "rc")}
          ${row("Invoice PDD", a.inv, "invins")}
          ${row("Insurance PDD", a.ins, "invins")}
        </tbody>
      </table>
    </div>`;
}

function screenTranche() {
  return `
    <div class="crumb"><span class="link" data-nav="tranches">← PDD – Tranches</span> / Tranche 01</div>
    <div class="card">
      <div class="card-hd">
        <div class="ttl"><div class="num ico">01</div><div><h2>TRANCHE 01 – PDD CHECKLISTS</h2><p>2 vehicles · Disbursed 12 Oct 2026 · Disbursement Amount ₹19,00,000</p></div></div>
      </div>
    </div>
    <div class="tag">[LWC (new): pddAssetChecklists] · status values shown are illustrative – to be confirmed</div>
    ${assetBlock("a1", 1)}
    ${assetBlock("a2", 2)}`;
}

/* ---------- Screen 3: RC PDD (Maker) ---------- */
function screenRc() {
  const rc = rcCopyRule();
  const ack = ackRule();
  const failed = state.vahan === "failed";
  const vahanBlock = failed
    ? `
      <div class="alert err">⚠ <div><b>Vahan API failed – attempt 5 of 5.</b><br/>Retry is available after the 15-minute cooling period (14:32 remaining). You can enter the RC details manually meanwhile.</div></div>

    : `

  return `
    <div class="crumb"><span class="link" data-nav="tranches">← PDD – Tranches</span> / <span class="link" data-nav="tranche">Tranche 01</span> / Asset 1 / RC PDD</div>

        <div class="inline" style="margin-bottom:12px;max-width:620px">
          <div class="field"><label>RC No <span class="req">*</span></label><input value="MH12AB1234" /></div>
          <button class="btn primary" ${failed ? "disabled" : ""}>⟳ Fetch Vahan Details</button>

          ${uploadTile("RC Copy", rc, "RC_MH12AB1234.pdf")}

}

/* ---------- Screen 5: Checker pool ---------- */
const POOL_ROWS = [

  ["APP-2026-094521", "Tranche 01", "…8654", "Insurance PDD", "Auto", "Amit Verma", "21 Oct 2026 10:20", null],
  ["APP-2026-093310", "Tranche 02", "…7781", "RC PDD", "CE/CV", "Neha Joshi", "21 Oct 2026 12:40", null],
  ["APP-2026-092877", "Tranche 01", "…6620", "RC PDD", "Auto", "Rahul Mehta", "20 Oct 2026 16:05", "Priya Nair"]
];

function screenPool() {
  const mine = state.poolTab === "mine";

/* ---------- Screen 6: Checker review ---------- */
function screenReview() {
  const rc = rcCopyRule();
  const ack = ackRule();
  const approve = state.decision === "approve";
  const fcPanel = !approve ? "" : state.fc === "success"
    ? `<div class="alert ok">✓ <div><b>FC API success</b> – RC details updated in CBS. RC PDD marked as <b>Completed</b>.</div></div>`
    : `<div class="alert err">⚠ <div><b>FC API failed</b> – RC details were not updated in CBS. The checklist is not completed yet.<br/>Attempt 2 of 5 · next retry available after the cooling period.</div></div>
       <div style="display:flex;gap:8px;align-items:center"><button class="btn primary">⟳ Retrigger FC API</button><span class="muted">5 retries · 15-minute cooling period</span></div>`;
  return `
    <div class="crumb"><span class="link" data-nav="pool">← Central Loan Servicing Pool</span> / APP-2026-092877 / Tranche 01 / RC PDD</div>
    <div class="card">
      <div class="card-hd">
        <div class="ttl"><div class="ico">RC</div><div><h2>RC PDD REVIEW – ASSET 1</h2><p>LAN …6620 · Submitted by Rahul Mehta (Sales) on 20 Oct 2026 · ${state.product} · ${state.assetType}</p></div></div>
      </div>
      <div class="card-bd">
        <div class="tag">[LWC (new): pddCheckerReview]</div>
        ${state.vahan === "failed" ? `<div class="alert warn">✎ <div><b>RC details were entered manually by Sales</b> after the Vahan API failed. Retrigger Vahan to verify.</div></div>` : ""}
        <div class="inline" style="margin-bottom:12px;max-width:620px">
          <div class="field"><label>RC No</label><input value="MH12CD5678" readonly /></div>
          <button class="btn">⟳ Retrigger Vahan</button>
          <span class="muted">Attempts used: 1 / 5</span>
        </div>
        ${vahanTable()}
        <h3 style="margin:18px 0 10px;font-size:13px">Documents (view only)</h3>
        <div class="uploads">
          ${uploadTile("RC Copy", rc, "RC_MH12CD5678.pdf", true)}
          ${uploadTile("Acknowledgement", ack, state.assetType === "Non-Registrable" ? "Ack_RTO_Receipt.pdf" : null, true)}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="sub-hd"><h3>Checker decision</h3><span class="tag inline-tag">[LWC (new): pddCheckerDecision]</span></div>
      <div class="card-bd">
        <div class="decision">
          <label class="${approve ? "sel-approve" : ""}" data-group="decision" data-value="approve"><input type="radio" ${approve ? "checked" : ""}/> Approve</label>
          <label class="${approve ? "" : "sel-return"}" data-group="decision" data-value="return"><input type="radio" ${approve ? "" : "checked"}/> Return</label>
        </div>
        <div class="field" style="max-width:720px"><label>Remarks (optional)</label><textarea rows="3" placeholder="Add remarks for Sales">${approve ? "" : "RC copy unclear, re-upload."}</textarea></div>
        <div class="muted" style="margin:8px 0 12px">${approve
          ? "On approval of the RC PDD, the FC API is called to update the RC details in CBS (FC API applies to RC PDD only)."
          : "On return, the checklist goes back to PDD Maker and is assigned to the Sales user who last worked on it."}</div>
        ${fcPanel}
      </div>
      <div class="footer-actions">
        <button class="btn" data-nav="pool">Back to Pool</button>
        <button class="btn">Release to Pool</button>
        <button class="btn ${approve ? "success" : "danger"}">${approve ? "Submit – Approve" : "Submit – Return"}</button>
      </div>
    </div>`;
}

const RENDER = { tranches: screenTranches, tranche: screenTranche, rc: screenRc, invins: screenInvIns, pool: screenPool, review: screenReview };

function render() {
  document.getElementById("app").classList.toggle("annot", state.annot === true);
  document.getElementById("productLabel").textContent = state.product;
  document.getElementById("avatar").textContent = isChecker() ? "P" : "A";
  renderReviewBar();
  renderSidebar();
  document.getElementById("main").innerHTML = state.screen === "all" ? renderAll() : RENDER[state.screen]();
  try { history.replaceState(null, "", "#" + state.screen); } catch (e) { /* sandboxed previews disallow history access */ }
}

function renderAll() {
  const current = state.screen;
  const html = SCREENS.map(([v, l]) => {
    state.screen = v;
    return `<div class="all-title">${l}</div>${RENDER[v]()}`;
  }).join("");
  state.screen = current;
  return html;
}

document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { state.screen = nav.dataset.nav; render(); return; }
  const opt = e.target.closest("[data-group]");
  if (opt) {
    const raw = opt.dataset.value;
    state[opt.dataset.group] = raw === "true" ? true : raw === "false" ? false : raw;
    render();
  }
});

const initial = location.hash.slice(1);
if (initial === "all" || RENDER[initial]) state.screen = initial;
render();
</script>
