<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ops Maker &amp; Ops Checker – Screen Mockups</title>
  <style>
    :root {
      --navy-950: #0b1630;
      --navy-900: #13213d;
      --navy-850: #18284a;
      --blue-600: #1d6fd8;
      --blue-100: #e3eefc;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f6f8fb;
      --green-600: #16a34a;
      --green-100: #dcfce7;
      --amber-700: #b45309;
      --amber-100: #fef3c7;
      --red-600: #dc2626;
      --red-100: #fee2e2;
      --white: #fff;
      --font: "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); font-size: 13px; color: var(--slate-900); background: #d9dfe8; }
    button, input, select, textarea { font: inherit; }

    /* Reviewer toolbar (not part of the product UI) */
    .review-bar { background: #fff7e6; border-bottom: 1px solid #f3d08a; padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
    .review-bar strong { color: var(--amber-700); }
    .review-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .review-group span { color: var(--slate-600); margin-right: 2px; }
    .seg { border: 1px solid var(--slate-300); background: var(--white); padding: 3px 9px; border-radius: 4px; cursor: pointer; }
    .seg.on { background: var(--navy-900); color: var(--white); border-color: var(--navy-900); }
    .all-title { margin: 28px 0 10px; padding: 6px 12px; background: #fff7e6; border-left: 4px solid #f0a020; font-weight: 700; font-size: 15px; }
    .all-title:first-child { margin-top: 0; }

    /* App shell (matches MOGA LOS) */
    .app { max-width: 1320px; margin: 12px auto; background: var(--slate-50); box-shadow: 0 6px 24px rgba(15,23,42,.18); }
    .topnav { height: 46px; background: var(--white); display: flex; align-items: center; padding: 0 14px; gap: 22px; border-bottom: 1px solid var(--slate-200); }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .logo-mark { width: 26px; height: 26px; border-radius: 5px; background: var(--blue-600); color: var(--white); display: grid; place-items: center; font-size: 12px; }
    .topnav a { color: var(--slate-700); text-decoration: none; padding: 13px 4px; cursor: pointer; }
    .topnav a.active { color: var(--blue-600); border-bottom: 2px solid var(--blue-600); }
    .topnav .spacer { flex: 1; }
    .util { display: flex; gap: 12px; align-items: center; color: var(--slate-500); }
    .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--blue-600); color: var(--white); display: grid; place-items: center; font-weight: 700; }

    .app-header { background: var(--navy-900); color: var(--white); padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; }
    .app-header h1 { font-size: 14px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .name-chip { background: #34425f; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
    .app-header .meta { color: #a9b8d6; font-size: 11px; margin-top: 2px; }
    .hdr-actions { display: flex; gap: 8px; align-items: center; }
    .btn-dark { background: #2b3a5a; color: var(--white); border: 1px solid #4a5a7c; padding: 5px 12px; border-radius: 4px; font-weight: 600; font-size: 11px; }

    .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 720px; }
    .layout.no-side { grid-template-columns: 1fr; }
    .layout.no-side .sidebar { display: none; }
    .sidebar { background: var(--navy-950); color: #c9d4ea; padding: 10px 0; font-size: 12px; }
    .tranche-pick { margin: 4px 12px 12px; padding: 8px 10px; border: 1px solid #2d3d60; border-radius: 5px; color: var(--white); font-weight: 600; display: flex; justify-content: space-between; }
    .grp { padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; color: #8d9bb8; font-weight: 600; letter-spacing: .02em; }
    .grp.open { color: var(--white); }
    .grp.link-grp { cursor: pointer; }
    .item { padding: 7px 14px 7px 22px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
    .item .dot { width: 6px; height: 6px; border-radius: 50%; background: #5b6b8c; }
    .item.done .dot { background: var(--green-600); }
    .item.active { background: var(--navy-850); color: var(--white); }
    .item.active .dot { background: #4da3ff; }
    .item .side-note { margin-left: auto; font-size: 10px; color: #7e8db0; }

    .main { padding: 16px 18px 28px; }
    .screen-wrap { position: relative; }
    .card { background: var(--white); border: 1px solid var(--slate-200); border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
    .card-hd { background: var(--navy-900); color: var(--white); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card-hd .ttl { display: flex; align-items: center; gap: 10px; }
    .ico { width: 30px; height: 30px; border-radius: 4px; background: #2d3d60; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
    .card-hd h2 { font-size: 13px; margin: 0; letter-spacing: .02em; }
    .card-hd p { margin: 2px 0 0; color: #a9b8d6; font-size: 11px; }
    .card-bd { padding: 14px; }
    .sub-hd { padding: 10px 14px; border-bottom: 1px solid var(--slate-200); background: var(--slate-50); display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    .sub-hd h3 { margin: 0; font-size: 13px; }
    .muted { color: var(--slate-500); font-size: 11px; }
    .btn { border: 1px solid var(--slate-300); background: var(--white); color: var(--slate-900); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; }
    .btn.primary { background: var(--blue-600); border-color: var(--blue-600); color: var(--white); }
    .btn.danger { color: var(--red-600); border-color: #f2b8b8; }
    .btn.success { background: var(--green-600); border-color: var(--green-600); color: var(--white); }
    .btn[disabled] { opacity: .45; cursor: not-allowed; }
    .btn.sm { padding: 3px 9px; font-size: 11px; }
    .link { color: var(--blue-600); cursor: pointer; font-weight: 600; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .b-green { background: var(--green-100); color: #166534; }
    .b-amber { background: var(--amber-100); color: var(--amber-700); }
    .b-red { background: var(--red-100); color: #991b1b; }
    .b-blue { background: var(--blue-100); color: #1e4f99; }
    .b-grey { background: var(--slate-100); color: var(--slate-600); }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; color: var(--slate-500); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--slate-200); background: var(--slate-50); }
    td { padding: 8px 10px; border-bottom: 1px solid var(--slate-100); vertical-align: middle; }
    tr.bad td { background: #fff5f5; }
    tr.sel td { background: #f1f7ff; }
    td select, td input { border: 1px solid var(--slate-300); border-radius: 4px; padding: 4px 6px; background: var(--white); width: 100%; }
    td select.ftnr { border-color: var(--red-600); color: #991b1b; }
    td select.unmarked { border-color: var(--red-600); }

    .group-hd { padding: 9px 14px; background: var(--slate-50); border-bottom: 1px solid var(--slate-200); border-top: 1px solid var(--slate-200); font-weight: 700; display: flex; gap: 10px; align-items: center; }
    .group-hd .muted { font-weight: 400; }

    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; }
    .field label { display: block; font-size: 11px; color: var(--slate-600); margin-bottom: 4px; font-weight: 600; }
    .field label .req { color: var(--red-600); }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--slate-300); border-radius: 4px; padding: 6px 8px; background: var(--white); }
    .field input[readonly], .field textarea[readonly] { background: var(--slate-100); color: var(--slate-700); }
    .kv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .kv div { background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: 5px; padding: 8px 10px; }
    .kv b { display: block; font-size: 14px; margin-top: 3px; }

    .alert { border-radius: 5px; padding: 10px 12px; margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; }
    .alert.err { background: var(--red-100); border: 1px solid #f5b5b5; color: #7f1d1d; }
    .alert.ok { background: var(--green-100); border: 1px solid #a7e3bb; color: #14532d; }
    .alert.warn { background: var(--amber-100); border: 1px solid #f0cf8a; color: #78350f; }
    .alert.info { background: var(--blue-100); border: 1px solid #b9d3f6; color: #1e3a8a; }
    .alert ul { margin: 4px 0 0; padding-left: 18px; }

    .tranche-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .tranche { border: 1px solid var(--slate-200); border-radius: 6px; padding: 12px; display: flex; gap: 12px; cursor: pointer; background: var(--white); }
    .tranche.on { border-color: var(--blue-600); box-shadow: 0 0 0 2px var(--blue-100); }
    .tranche.locked { opacity: .6; }
    .tranche .num { width: 34px; height: 34px; border-radius: 4px; background: var(--slate-100); display: grid; place-items: center; font-weight: 700; font-size: 11px; }
    .tranche h4 { margin: 0 0 2px; font-size: 13px; }
    .amt { color: var(--blue-600); font-weight: 600; font-size: 11px; margin-top: 3px; }

    .footer-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--slate-200); background: var(--slate-50); align-items: center; }
    .footer-actions .left { margin-right: auto; display: flex; gap: 8px; }
    .declare { display: flex; gap: 8px; align-items: flex-start; padding: 10px 14px; border-top: 1px solid var(--slate-200); }
    .crumb { margin-bottom: 10px; font-size: 12px; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--slate-200); padding: 0 14px; background: var(--white); flex-wrap: wrap; }
    .tab { padding: 10px 14px; cursor: pointer; color: var(--slate-600); font-weight: 600; border-bottom: 2px solid transparent; }
    .tab.on { color: var(--blue-600); border-bottom-color: var(--blue-600); }
    .stage-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stage-box { border: 1px solid var(--slate-200); border-radius: 6px; padding: 10px 12px; }
    .stage-box h4 { margin: 0 0 6px; font-size: 12px; display: flex; justify-content: space-between; }
    .stage-box .row { display: flex; justify-content: space-between; padding: 4px 0; border-top: 1px dashed var(--slate-200); font-size: 12px; }

    /* Dedupe Check Results */
    .hd-chip { background: var(--white); color: var(--navy-900); border-radius: 12px; padding: 3px 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .hd-chip.ok { background: var(--green-100); color: #166534; }
    .hd-chip.err { background: var(--red-100); color: #991b1b; }
    .hd-chip.warn { background: var(--amber-100); color: var(--amber-700); }
    .cif-row { display: flex; gap: 12px; align-items: center; padding: 14px; flex-wrap: wrap; }
    .cif-row .lbl { font-size: 11px; color: var(--slate-500); font-weight: 600; letter-spacing: .03em; }
    .cif-card { border: 1px solid var(--slate-200); border-radius: 6px; padding: 10px 14px; min-width: 230px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; background: var(--white); }
    .cif-card.on { border: 2px solid var(--navy-900); background: #f5f7fd; padding: 9px 13px; }
    .cif-card.locked { cursor: default; }
    .cif-card .radio { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--slate-300); margin-top: 2px; flex: none; }
    .cif-card.on .radio { border: 4px solid var(--navy-900); }
    .cif-card b { font-size: 12px; }
    .score { font-size: 11px; color: var(--slate-500); margin-top: 3px; }
    .score.partial { color: var(--amber-700); }
    .cif-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 14px 12px; }
    .btn.navy { background: var(--navy-900); border-color: var(--navy-900); color: var(--white); }
    .filter-row { display: flex; gap: 6px; align-items: center; padding: 0 14px 10px; }
    .filter-row .search { margin-left: auto; width: 240px; border: 1px solid var(--slate-300); border-radius: 4px; padding: 5px 8px; font-size: 12px; }
    .pill { border: 0; background: var(--slate-100); color: var(--slate-700); border-radius: 12px; padding: 3px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .pill.on { background: var(--navy-900); color: var(--white); }
    .st { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; font-size: 9px; font-weight: 700; color: var(--white); }
    .st.ok { background: var(--green-600); }
    .st.err { background: var(--red-600); }
    .st.warn { background: none; width: 0; height: 0; border-radius: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid #d97706; }
    td.st-col, th.st-col { text-align: right; }
    .cmp td { padding: 11px 10px; }

    /* Document Verification */
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px 14px; }
    .tile { border-radius: 6px; padding: 9px 12px; border: 1px solid transparent; }
    .tile span { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .tile b { display: block; font-size: 17px; margin-top: 4px; }
    .tile.total { background: #e8eef7; color: var(--navy-900); }
    .tile.ftr { background: var(--green-100); color: #166534; }
    .tile.ftnr { background: var(--red-100); color: #991b1b; }
    .tile.final { background: var(--white); border-color: var(--slate-200); color: var(--slate-700); }
    .tile.final b { font-size: 13px; }
    .vt { display: inline-flex; border: 1px solid var(--slate-300); border-radius: 4px; overflow: hidden; }
    .vt button { border: 0; border-left: 1px solid var(--slate-300); background: var(--white); padding: 3px 10px; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--slate-700); }
    .vt button:first-child { border-left: 0; }
    .vt button.ftnr { color: #991b1b; }
    .vt button.on.ftr { background: var(--green-600); color: var(--white); }
    .vt button.on.ftnr { background: var(--red-600); color: var(--white); }
    .vt button.on.na { background: var(--slate-500); color: var(--white); }
    .subtabs { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--slate-200); background: var(--slate-50); }
    .subtabs .seg { padding: 5px 12px; }
    .doc-tbl td input { border: 1px solid var(--slate-300); border-radius: 4px; padding: 4px 6px; width: 100%; }
    .legend { color: var(--slate-500); font-size: 11px; margin-right: auto; }

    /* Pop-ups */
    .overlay { position: absolute; inset: 0; background: rgba(15,23,42,.45); display: flex; justify-content: center; align-items: flex-start; padding-top: 40px; border-radius: 6px; min-height: 560px; }
    .modal { background: var(--white); width: 640px; max-width: 94%; border-radius: 8px; box-shadow: 0 16px 40px rgba(15,23,42,.35); overflow: hidden; }
    .modal-hd { padding: 12px 16px; border-bottom: 1px solid var(--slate-200); display: flex; justify-content: space-between; align-items: center; }
    .modal-hd h3 { margin: 0; font-size: 14px; }
    .modal-bd { padding: 14px 16px; display: grid; gap: 12px; }
    .modal-ft { padding: 12px 16px; border-top: 1px solid var(--slate-200); display: flex; justify-content: flex-end; gap: 8px; background: var(--slate-50); }
    .x { cursor: pointer; color: var(--slate-500); font-size: 16px; border: 0; background: none; }
    .checks { display: grid; gap: 6px; border: 1px solid var(--slate-300); border-radius: 4px; padding: 8px 10px; max-height: 150px; overflow: auto; }
    .checks label { display: flex; gap: 8px; align-items: center; font-weight: 400; color: var(--slate-900); font-size: 12px; margin: 0; }
    .segs { display: flex; gap: 6px; }
    .segs .seg { padding: 5px 12px; }

    /* Annotations */
    .tag { display: none; font-family: Consolas, monospace; font-size: 10px; color: #7c3aed; background: #f3e8ff; border: 1px dashed #c4b5fd; padding: 1px 6px; border-radius: 3px; margin: 0 0 6px; width: fit-content; }
    .annot .tag { display: block; }
    .pending-note { display: none; }
    .annot .pending-note { display: flex; }
  </style>
</head>
<body>

<div class="review-bar" id="reviewBar"></div>

<div class="app" id="app">
  <div class="topnav">
    <div class="logo"><div class="logo-mark">M</div>MOGA</div>
    <a>Home</a>
    <a class="active">Applications ▾</a>
    <a>Queries</a>
    <div class="spacer"></div>
    <div class="util">⭐ ＋ ？ ⚙ 🔔 <div class="avatar" id="avatar">K</div></div>
  </div>

  <div class="app-header" id="appHeader">
    <div>
      <h1>Application Overview <span class="name-chip">▸ RAJESH KAPOOR</span></h1>
      <div class="meta" id="appMeta"></div>
    </div>
    <div class="hdr-actions">
      <button class="btn-dark">⏸ PAUSE</button>
      <span style="color:#a9b8d6">↺ 👤 ⧉ ▦</span>

  <div class="layout" id="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<script>
const state = {
  screen: "m-de",
  product: "Auto",
  vehicle: "New",
  tranche: "01",
  dedupe: "etb",
  deApp: "0",
  deCif: "b",
  deFilter: "all",
  docs: "complete",
  dvTab: "loan",
  dvApp: "0",
  dvAsset: "",
  marks: {},
  disb: "pending",
  poolTab: "pool",
  viewTab: "failed",
  qRole: "maker",
  qTab: "m1",
  qLevel: "Asset",
  modal: "",
  revCtx: "maker-dv",
  annot: false
};

const SCREENS = [
  ["m-de", "1. Ops Maker – Dedupe & Eligibility"],
  ["m-dv", "2. Ops Maker – Document Verification"],
  ["m-pd", "3. Ops Maker – Payment Disbursement"],
  ["pool", "4. Ops Checker (LPU) Pool"],
  ["c-de", "5. Ops Checker – Dedupe & Eligibility"],
  ["c-dv", "6. Ops Checker – Document Verification"],
  ["c-pd", "7. Ops Checker – Payment Disbursement"],
  ["p-query", "8. Raise Query (pop-up)"],
  ["p-rev", "9. Stage Reversal (pop-up)"],
  ["p-chk", "10. Ops Checklist & Declaration (pop-up)"],
  ["views", "11. Disbursement Views"],
  ["queries", "12. Query List Views"],
  ["prev", "13. Previous Stages (read-only)"]

const LIST_SCREENS = ["pool", "views", "queries"];
const isChecker = () => state.screen.startsWith("c-") || state.screen === "pool" || state.screen === "p-chk";

/* ---------- Sample data (illustrative only) ---------- */
const APPLICANTS = [
  { name: "Rajesh Kapoor", type: "Borrower", rel: "ETB", cif: "CIF ••••4821" },
  { name: "Sunita Kapoor", type: "Co-Borrower", rel: "NTB", cif: "" },
  { name: "Vikram Rao", type: "Guarantor", rel: "NTB", cif: "" }
];

function assets() {
  if (state.product === "CE/CV") {
    return state.tranche === "01"
      ? [
          { id: "A1", label: "Asset 1 · Chassis", vt: "Chassis", make: "Tata Motors", model: "Signa 4825.TK", variant: "BS VI", price: "₹ 34,00,000", lan: "LAN 0042 0201 0003 1101", col: "COL-77810021", cif: "CIF ••••4821", utr: "UTR ••••90412" },
          { id: "A2", label: "Asset 2 · Body (linked to Asset 1)", vt: "Body", make: "Tata Motors", model: "Tipper Body 16 Cum", variant: "Box type", price: "₹ 8,00,000", lan: "LAN 0042 0201 0003 1102", col: "COL-77810022", cif: "CIF ••••4821", utr: "UTR ••••90413", body: true }
        ]
      : [
          { id: "A3", label: "Asset 3 · Chassis", vt: "Chassis", make: "Ashok Leyland", model: "Ecomet 1615", variant: "HE", price: "₹ 26,00,000", lan: "LAN 0042 0201 0003 1103", col: "COL-77810023", cif: "CIF ••••4821", utr: "UTR ••••90414" }
        ];
  }
  return state.tranche === "01"
    ? [
        { id: "A1", label: "Asset 1", vt: state.vehicle === "New" ? "Car" : "Car (Used)", make: "Tata Motors", model: "Nexon", variant: "XZ Plus", price: "₹ 9,85,000", lan: "LAN 0042 0101 0008 7654", col: "COL-55120011", cif: "CIF ••••4821", utr: "UTR ••••71230" },
        { id: "A2", label: "Asset 2", vt: state.vehicle === "New" ? "Car" : "Car (Used)", make: "Tata Motors", model: "Nexon", variant: "XM", price: "₹ 9,15,000", lan: "LAN 0042 0101 0008 7655", col: "COL-55120012", cif: "CIF ••••4821", utr: "UTR ••••71231" }

  { f: "Customer Type", s: "Individual", a: "Individual", b: "Individual" }
];

function dedupeScenario() {
  return state.tranche === "01" ? state.dedupe : "etb";
}

function dedupeApplicants() {
  const sc = dedupeScenario();
  return APPLICANTS.map((a, i) => ({ ...a, rel: i === 0 ? (["etb", "suspect"].includes(sc) ? "ETB" : "NTB") : a.rel }));
}

function selectedCifKey() {
  return ["etb", "suspect"].includes(dedupeScenario()) ? "a" : state.deCif;
}

function compareRows() {
  const key = selectedCifKey();
  const mismatch = dedupeScenario() === "mismatch";
  return DEDUPE_FIELDS.map((r) => {
    const fc = mismatch && r.mandatory ? "1984-06-16" : r[key];
    const status = fc === r.s ? "ok" : mismatch && r.mandatory ? "err" : "warn";
    return { ...r, fc, status };
  });
}

function statusIcon(s) {
  if (s === "ok") return '<span class="st ok" title="Match">✓</span>';
  if (s === "err") return '<span class="st err" title="Mandatory parameter mismatch">✕</span>';
  return '<span class="st warn" title="Mismatch / missing"></span>';
}

function dedupeResults(readOnly) {
  const sc = dedupeScenario();
  const app = dedupeApplicants()[Number(state.deApp)];
  const focus = state.deApp === "0";
  const appTabs = `<div class="tabs">${dedupeApplicants().map((a, i) => `<div class="tab ${state.deApp === String(i) ? "on" : ""}" data-group="deApp" data-value="${i}">${a.name} · ${a.type} <span class="muted">${a.rel}</span></div>`).join("")}</div>`;

  let chip = `Number of CIF Match Found : ${focus ? 2 : 0}`;
  let body;
  if (focus && sc === "apifail") {
    chip = "Number of CIF Match Found : —";
    body = `<div class="card-bd"><div class="alert err" style="margin:0">⚠ <div><b>Dedupe API failed for ${app.name} – attempt 5 of 5.</b><br/>Dedupe is mandatory to proceed. Retry is available after the 15-minute cooling period (14:32 remaining).</div><button class="btn sm" disabled>⟳ Retry</button></div></div>`;
  } else if (!focus) {
    body = `<div class="card-bd"><div class="alert info" style="margin:0">ⓘ <div>Dedupe returned no matching CIF in FC for <b>${app.name}</b>. The applicant remains <b>NTB</b>.</div></div></div>`;
  } else {
    const locked = readOnly || ["etb", "suspect"].includes(sc);
    const key = selectedCifKey();
    const rows = compareRows();
    const matches = rows.filter((r) => r.status === "ok").length;
    const shown = rows.filter((r) => state.deFilter === "all" || (state.deFilter === "match" ? r.status === "ok" : r.status !== "ok"));
    const cards = DEDUPE_CIFS.map((c) => `
      <div class="cif-card ${c.key === key ? "on" : ""} ${locked ? "locked" : ""}" ${locked ? "" : `data-group="deCif" data-value="${c.key}"`}>
        <span class="radio"></span>
        <div><b>CIF Number: ${c.cif.replace("CIF ", "")}</b> ${c.primary ? '<span class="badge b-green">Primary</span>' : ""}${locked && c.key === key ? ' <span class="badge b-blue">Linked</span>' : ""}
          <div class="score ${c.partial ? "partial" : ""}">${c.score}</div></div>
      </div>`).join("");
    const banner = locked
      ? `<div class="alert info" style="margin:0 14px 12px">ⓘ <div>${readOnly && state.tranche !== "01" ? "Dedupe &amp; Eligibility is navigated only once, for the first tranche. It was completed with <b>Tranche 01</b> on 28 Oct 2026 and is shown here as read only." : `CIF is already selected for the ETB applicant, so the Dedupe screen is <b>read only</b>. Dedupe and Suspect Registry were run afresh ${state.screen.startsWith("c-") ? "when the tranche moved to Ops Checker" : "when the tranche entered Ops Maker"}.`}</div></div>`
      : sc === "mismatch"
        ? `<div class="alert err" style="margin:0 14px 12px">⛔ <div><b>Hard stop – mandatory parameter mismatch on the selected CIF</b> (Date of Birth).<br/>Raise a query to Sales to get the data corrected in CBS, then use Re-run Dedupe to recheck.</div></div>`
        : "";
    const actions = locked
      ? ""
      : sc === "mismatch"
        ? `<div class="cif-actions"><button class="btn" data-modal="query">Raise Query to Sales</button><button class="btn navy">⟳ Re-run Dedupe</button></div>`
        : `<div class="cif-actions"><button class="btn navy">Link Selected CIF</button><button class="btn">Ignore &amp; Proceed New</button></div>`;
    body = `
      <div class="cif-row"><span class="lbl">SELECT RECORD:</span>${cards}</div>
      ${actions}
      ${banner}
      <div class="filter-row">
        <button class="pill ${state.deFilter === "all" ? "on" : ""}" data-group="deFilter" data-value="all">All Fields (${rows.length})</button>
        <button class="pill ${state.deFilter === "match" ? "on" : ""}" data-group="deFilter" data-value="match">Matches (${matches})</button>
        <button class="pill ${state.deFilter === "mis" ? "on" : ""}" data-group="deFilter" data-value="mis">Mismatches / Missing (${rows.length - matches})</button>
        <input class="search" placeholder="🔍 Search field name or value..." />
      </div>
      <table class="cmp">
        <thead><tr><th style="width:30%">Field Description</th><th style="width:30%">Data from SFDC</th><th style="width:30%">Data from FC</th><th class="st-col">Status</th></tr></thead>
        <tbody>${shown.map((r) => `<tr class="${r.status === "err" ? "bad" : ""}"><td>${r.f}</td><td>${r.sHtml || r.s}</td><td>${r.fc}</td><td class="st-col">${statusIcon(r.status)}</td></tr>`).join("") || '<tr><td colspan="4" class="muted">No fields in this view.</td></tr>'}</tbody>
      </table>
      <div class="alert info pending-note" style="margin:10px 14px">ⓘ Mandatory parameters to be matched on the selected CIF are the same as in Sales Negotiation – the Date of Birth mismatch shown is illustrative.</div>`;
  }

  return `
    <div class="card">
      <div class="card-hd"><div class="ttl"><div class="ico">🔍</div><div><h2>Dedupe Check Results</h2><p>Compare customer identity information between SFDC and FC databases</p></div></div><span class="hd-chip">${chip}</span></div>
      ${appTabs}
      <div class="tag" style="margin:8px 14px 0">[Existing: customerDedupeResultTable / customerDedupeMasterPage reused · Dedupe API · Integration_Checklist__c retry tracking]</div>
      ${body}
    </div>`;
}

  const loan = [
    doc("Loan Agreement.pdf", "Agreement", "Application Level", "28 Sep 2026"),

    doc("Repayment Mandate (NACH).pdf", "Repayment", "Application Level", "29 Sep 2026"),
    doc("DPN.pdf", "Agreement", "Application Level", "—", false, false)
  ];
  const applicants = [
    [doc("PAN Card.pdf", "Identity Proof", "Rajesh Kapoor", "28 Sep 2026"), doc("Aadhaar Card.pdf", "Address Proof", "Rajesh Kapoor", "28 Sep 2026"), doc("Bank Statement - 6 Months.pdf", "Banking", "Rajesh Kapoor", "29 Sep 2026", false), doc("Income Tax Return.pdf", "Income Proof", "Rajesh Kapoor", "29 Sep 2026")],
    [doc("PAN Card.pdf", "Identity Proof", "Sunita Kapoor", "29 Sep 2026"), doc("Aadhaar Card.pdf", "Address Proof", "Sunita Kapoor", "29 Sep 2026", true, true, { ftnrSample: true })],
    [doc("PAN Card.pdf", "Identity Proof", "Vikram Rao", "29 Sep 2026"), doc("Aadhaar Card.pdf", "Address Proof", "Vikram Rao", "29 Sep 2026")]
  ];
  const list = assets();
  const tranche = list.map((a, i) => {
    const who = `${a.label.split(" · ")[0]} · ${a.make} ${a.model}`;
    const last = i === list.length - 1;
    const docs = state.vehicle === "Used"
      ? [doc("RC Copy.pdf", "Asset Document", who, "30 Sep 2026"), doc("Valuation Report.pdf", "Valuation", who, "03 Oct 2026"), doc("Insurance Policy.pdf", "Insurance", who, "03 Oct 2026", true, true, { unmarkedSample: last }), doc("Seller NOC.pdf", "Asset Document", who, "—", false, false)]
      : [doc("Vehicle Quotation.pdf", "Asset Document", who, "30 Sep 2026"), doc("Invoice.pdf", "Asset Document", who, "02 Oct 2026"), doc("Insurance Policy.pdf", "Insurance", who, "03 Oct 2026", true, true, { unmarkedSample: last }), doc("Margin Money Receipt.pdf", "Asset Document", who, "—", false, false)];

function baseMark(d, checker) {
  if (!d.up) return "NA";
  if (state.docs === "none") return "";
  if (!checker && state.docs === "incomplete") {
    if (d.ftnrSample) return "FTNR";
    if (d.unmarkedSample) return "";
  }
  return "FTR";
}

function markOf(d, checker) {
  const k = `${checker ? "c" : "m"}:${d.id}`;
  return k in state.marks ? state.marks[k] : baseMark(d, checker);
}

function verifyToggle(d, checker) {
  if (!d.up) return '<span class="badge b-grey">NA</span>';
  const v = markOf(d, checker);
  const k = `${checker ? "c" : "m"}:${d.id}`;
  const opts = d.mand ? ["FTR", "FTNR"] : ["FTR", "FTNR", "NA"];
  return `<span class="vt">${opts.map((o) => `<button class="${o.toLowerCase()} ${v === o ? "on" : ""}" data-mark="${k}" data-value="${o}">${o}</button>`).join("")}</span>`;
}

function docTable(docs, checker, whoLabel) {
  return `
    <table class="doc-tbl">
      <thead><tr><th style="width:9%">Document ID</th><th style="width:22%">Document Name</th><th style="width:13%">Category</th>${whoLabel ? `<th style="width:15%">${whoLabel}</th>` : ""}<th style="width:10%">Uploaded On</th><th style="width:13%">Verification</th><th>Remarks (optional)</th></tr></thead>
      <tbody>${docs.map((d) => {
        const v = markOf(d, checker);
        const remark = !checker && v === "FTNR" && d.ftnrSample ? "Address on proof does not match KYC" : "";
        return `<tr class="${v === "FTNR" ? "bad" : ""}">
          <td class="muted">${d.id}</td>
          <td>${d.up ? `<span class="link">${d.name}</span><div class="muted">Salesforce File</div>` : `<b>${d.name}</b><div class="muted">Not uploaded</div>`}</td>
          <td>${d.cat}${d.mand ? "" : '<div class="muted">Optional</div>'}</td>
          ${whoLabel ? `<td>${d.who}</td>` : ""}
          <td>${d.date}</td>
          <td>${verifyToggle(d, checker)}${checker ? `<div class="muted" style="margin-top:3px">Ops Maker: ${d.up ? "FTR" : "NA"}</div>` : ""}</td>
          <td>${d.up ? `<input maxlength="255" placeholder="Max 255 characters" value="${remark}" />` : ""}</td>
        </tr>`;
      }).join("")}</tbody>
    </table>`;
}

}

function screenDv(checker) {
  const data = dvDocs();
  const uploaded = data.all.filter((d) => d.up);
  const marks = uploaded.map((d) => markOf(d, checker));
  const reviewed = marks.filter(Boolean).length;
  const ftr = marks.filter((m) => m === "FTR").length;
  const ftnr = marks.filter((m) => m === "FTNR").length;
  const ftnrDocs = data.all.filter((d) => markOf(d, checker) === "FTNR");
  const blocked = reviewed < uploaded.length || ftnr > 0;
  const finalOf = (isChecker) => {
    const ms = data.all.map((d) => markOf(d, isChecker));
    if (ms.includes("FTNR") || (!isChecker && state.docs === "incomplete")) return "FTNR";
    return ms.every(Boolean) ? "FTR" : "Pending";
  };
  const finalTile = (label, value, note = "") => `<div class="tile final"><span>${label}</span><b>${statusBadge(value)}${note ? ` <span class="muted">${note}</span>` : ""}</b></div>`;
  const tabs = [["loan", "Loan Application"], ["applicant", "Applicant"], ["tranche", `Tranche ${state.tranche}`]];

  return `
    <div class="card">
      <div class="card-hd"><div class="ttl"><div class="ico">DV</div><div><h2>Document Verification</h2><p>Review all uploaded application documents and mark each as FTR or FTNR</p></div></div><span class="hd-chip">${reviewed} of ${uploaded.length} Reviewed</span></div>
      <div class="tiles" style="grid-template-columns:repeat(${checker ? 5 : 4}, 1fr)">
        <div class="tile total"><span>Total Documents</span><b>${uploaded.length}</b></div>
        <div class="tile ftr"><span>FTR</span><b>${ftr}</b></div>

function assetStatus(a, idx) {
  if (state.tranche === "02") return "Pending";
  if (state.disb === "disbursed") return "Disbursed";
  if (state.disb === "failed") {
    if (state.product === "CE/CV") return idx === 0 ? "Failed" : "Pending";
    return idx === 0 ? "Disbursed" : "Failed";
  }
  return "Pending";
}

function trancheCards(selectable) {
  const amt = amounts();
  const t1Status = state.disb === "disbursed" ? '<span class="badge b-green">Disbursed</span>' : state.disb === "failed" ? '<span class="badge b-red">Failed</span>' : '<span class="badge b-grey">Pending</span>';
  const t2Locked = state.disb !== "disbursed";
  const card = (n, amount, mode, status, locked) => `
    <div class="tranche ${state.tranche === n ? "on" : ""} ${locked ? "locked" : ""}" ${selectable ? `data-group="tranche" data-value="${n}"` : ""}>
      <div class="num">${n}</div>

        <h4>Tranche ${n} ${status}</h4>
        <div class="amt">Tranche Amount: ${inr(amount)}</div>

        ${locked ? '<div class="muted" style="margin-top:4px">🔒 Available after Tranche 01 is disbursed</div>' : ""}
      </div>
    </div>`;
  return `
    <div class="tranche-grid">
      ${card("01", amt.t1, "RTGS", t1Status, false)}
      ${card("02", amt.t2, "NEFT", '<span class="badge b-grey">Pending</span>', t2Locked)}
    </div>`;
}

function summaryBlock() {

function assetTable() {
  const rows = assets().map((a, i) => {
    const st = assetStatus(a, i);
    const ok = st === "Disbursed";
    const err = st === "Failed" ? `<div class="muted" style="color:#991b1b">CBS loan creation API – timeout (attempt 2 of 5)</div>` : "";
    const wait = a.body && st === "Pending" && state.tranche === "01" ? '<div class="muted">Waits for chassis (Asset 1) to be disbursed</div>' : "";
    return `<tr class="${st === "Failed" ? "bad" : ""}">
      <td>${ok ? a.lan : '<span class="muted">—</span>'}</td>
      <td>${ok ? a.utr : '<span class="muted">—</span>'}</td>
      <td>${a.vt}</td>
      <td>${ok ? a.col : '<span class="muted">—</span>'}</td>
      <td>${a.make}</td><td>${a.model}</td><td>${a.variant}</td><td>${a.price}</td>
      <td>${statusBadge(st)}${err}${wait}</td>
    </tr>`;
  }).join("");
  return `
    <table>
      <thead><tr><th>LAN Number</th><th>UTR</th><th>Vehicle Type</th><th>Collateral ID</th><th>Make</th><th>Model</th><th>Variant</th><th>Ex-showroom Price</th><th>Status</th></tr></thead>

}

function reverseFeed() {
  const rows = assets().map((a, i) => ({ a, st: assetStatus(a, i) })).filter((r) => r.st === "Disbursed");
  if (!rows.length) return "";
  return `
    <div class="group-hd">FC reverse feed <span class="muted">Values received from CBS after disbursement</span></div>
    <table>
      <thead><tr><th>Asset</th><th>Collateral ID</th><th>LAN</th><th>CIF</th><th>UTR</th></tr></thead>

    </table>`;
}

const RENDER = {
  "m-de": () => screenDe(false),
  "m-dv": () => screenDv(false),
  "m-pd": () => screenPd(false),
  pool: screenPool,
  "c-de": () => screenDe(true),
  "c-dv": () => screenDv(true),
  "c-pd": () => screenPd(true),
  "p-query": () => screenDv(false),
  "p-rev": () => screenDv(false),
  "p-chk": () => screenPd(true),
  views: screenViews,
  queries: screenQueries,
  prev: screenPrev
};
const FIXED_MODAL = { "p-query": "query", "p-rev": "reversal", "p-chk": "opschecklist" };

function page(key, modalKey) {
  const modal = modalKey && MODALS[modalKey] ? `<div class="overlay">${MODALS[modalKey]()}</div>` : "";
  return `<div class="screen-wrap">${RENDER[key]()}${modal}</div>`;
}

function renderScreen(key) {
  return page(key, FIXED_MODAL[key] || state.modal);
}

function render() {
  const all = state.screen === "all";
  document.getElementById("app").classList.toggle("annot", state.annot === true);
  document.getElementById("avatar").textContent = isChecker() ? "P" : "K";
  document.getElementById("appMeta").textContent = `# APP-2026-094521 | Vehicle | ${state.product} | ${state.vehicle} | Tranche ${state.tranche} of 02`;
  const list = !all && LIST_SCREENS.includes(state.screen);
  document.getElementById("appHeader").style.display = list ? "none" : "";
  document.getElementById("layout").classList.toggle("no-side", list);
  renderReviewBar();
  renderSidebar();
  document.getElementById("main").innerHTML = all ? renderAll() : renderScreen(state.screen);
  try { history.replaceState(null, "", "#" + state.screen); } catch (e) { /* sandboxed previews disallow history access */ }
}

function renderAll() {
  const current = state.screen;
  const modal = state.modal;
  const revCtx = state.revCtx;
  state.modal = "";
  state.revCtx = "maker-dv";
  const html = SCREENS.map(([v, l]) => {
    state.screen = v;
    return `<div class="all-title">${l}</div>${renderScreen(v)}`;
  }).join("");
  state.screen = current;
  state.modal = modal;
  state.revCtx = revCtx;
  return html;
}

document.addEventListener("click", (e) => {
  const modal = e.target.closest("[data-modal]");
  if (modal && !modal.disabled) {
    state.modal = modal.dataset.modal;
    if (modal.dataset.ctx) state.revCtx = modal.dataset.ctx;
    if (!state.modal && FIXED_MODAL[state.screen]) state.screen = state.screen === "p-chk" ? "c-pd" : "m-dv";
    render();
    return;
  }
  const mark = e.target.closest("[data-mark]");
  if (mark) { state.marks[mark.dataset.mark] = mark.dataset.value; render(); return; }
  const nav = e.target.closest("[data-nav]");
  if (nav && !nav.disabled) { state.screen = nav.dataset.nav; state.modal = ""; render(); return; }
  const opt = e.target.closest("[data-group]");
  if (opt) {
    const raw = opt.dataset.value;
    state[opt.dataset.group] = raw === "true" ? true : raw === "false" ? false : raw;
    if (opt.dataset.group === "screen") state.modal = "";
    if (opt.dataset.group === "qRole") state.qTab = raw === "maker" ? "m1" : "c1";
    if (opt.dataset.group === "dedupe") state.deApp = "0";
    if (["docs", "tranche", "product", "vehicle"].includes(opt.dataset.group)) state.marks = {};
    if (["tranche", "product"].includes(opt.dataset.group)) state.dvAsset = "";
    if (opt.dataset.group === "screen" && raw === "p-rev") state.revCtx = "maker-dv";
    render();
  }
});

const initial = location.hash.slice(1);
if (initial === "all" || RENDER[initial]) state.screen = initial;
render();
</script>
</body>
</html>
