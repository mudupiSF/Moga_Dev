<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Ground Anchor Line -->
  <line x1="8" y1="54" x2="56" y2="54" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />

  <!-- TWO-WHEELER SHAPE -->
  <g id="motorcycle">
    <!-- Rear Wheel -->
    <circle cx="18" cy="46" r="8" stroke="#1E293B" stroke-width="3.5" fill="none" />
    <circle cx="18" cy="46" r="2.5" fill="#10B981" />
    <path d="M10,42 A8,8 0 0,1 22,39" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Front Wheel -->
    <circle cx="46" cy="46" r="8" stroke="#1E293B" stroke-width="3.5" fill="none" />
    <circle cx="46" cy="46" r="2.5" fill="#10B981" />
    <path d="M39,41 A8,8 0 0,1 51,39" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Chassis / Main Frame -->
    <path d="M18,46 L25,32 H37 L41,21 H36" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Front Fork -->
    <path d="M41,21 L46,46" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Cushioned Seat -->
    <path d="M20,32 C20,32 23,29 29,29 C35,29 36,32 36,32 Z" fill="#1E293B" />
    
    <!-- Engine / Accent Detail -->
    <rect x="27" y="37" width="8" height="6" rx="1" fill="#CBD5E1" stroke="#1E293B" stroke-width="2" />
  </g>

  <!-- LOAN / PERCENT BADGE (Top Right Corner) -->
  <g id="loan-badge">
    <!-- Badge Background with White Border Clearance -->
    <circle cx="48" cy="18" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
    
    <!-- Stylized Percentage Symbol (%) -->
    <line x1="44" y1="22" x2="52" y2="14" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="44.5" cy="14.5" r="1.2" fill="#FFFFFF" />
    <circle cx="51.5" cy="21.5" r="1.2" fill="#FFFFFF" />
  </g>
</svg>
