<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Ground Anchor Line -->
  <line x1="8" y1="54" x2="56" y2="54" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />

  <!-- FOUR-WHEELER (CAR) SHAPE -->
  <g id="car">
    <!-- Rear Wheel -->
    <circle cx="18" cy="46" r="7.5" stroke="#1E293B" stroke-width="3.5" fill="none" />
    <circle cx="18" cy="46" r="2" fill="#10B981" />

    <!-- Front Wheel -->
    <circle cx="44" cy="46" r="7.5" stroke="#1E293B" stroke-width="3.5" fill="none" />
    <circle cx="44" cy="46" r="2" fill="#10B981" />

    <!-- Main Car Body Shell -->
    <path d="M 10.5,39 L 6,39 C 5,39 4,38 4,36 L 4,32 C 4,29 7,28 12,28 L 19,28 L 25,18 C 26,16 28,16 30,18 L 41,18 C 43,18 44,19 45,21 L 51,31 L 55,31 C 57,31 59,33 59,35 L 59,39 L 51.5,39" 
          stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Center Rocker Panel (Between Wheels) -->
    <line x1="25.5" y1="39" x2="36.5" y2="39" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />

    <!-- Windows & Center Pillar -->
    <path d="M 21.5,28 L 26.5,20 H 40.5 L 44,28 Z" stroke="#1E293B" stroke-width="2" stroke-linejoin="round" fill="none" />
    <line x1="33" y1="20" x2="33" y2="28" stroke="#1E293B" stroke-width="2" />

    <!-- Side Trim / Door Handle Accent -->
    <rect x="27" y="32" width="7" height="2.5" rx="1" fill="#CBD5E1" stroke="#1E293B" stroke-width="1.5" />
  </g>

  <!-- LOAN / PERCENT BADGE (Top Right Corner) -->
  <g id="loan-badge">
    <!-- Badge Background with White Border Clearance -->
    <circle cx="48" cy="18" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
    
    <!-- Stylized Percentage Symbol (%) -->
    <line x1="44" y1="22" x2="52" y2="14" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="44.5" cy="14.5" r="1.2" fill="#FFFFFF" />
    <circle cx="51.5" cy="21.5" r="1.2" fill="#FFFFFF" />
  </g>
</svg>
