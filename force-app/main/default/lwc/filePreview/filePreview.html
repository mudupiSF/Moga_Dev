<template>
    <lightning-button label={label} name={label} disabled={disabled} icon-name="utility:preview" variant={variant}
        onclick={previewFile}></lightning-button>
    <template lwc:if={openModal}>
        <template lwc:if={isVideoFile}>
            <!--c-axis-video-previewer muted controlslist="nodownload noplaybackrate" disablepictureinpicture document-id={documentId}>
            </c-axis-video-previewer-->
        </template>
        <template lwc:else>
            <template if:false={isHTMLFile}>
                <template if:false={isPDFFile}>
                    <span style="z-index: 9001 !important;">
                        <c-show-file-preview onclosepreview={closeModal} image-value={imageURL} inline={inline}></c-show-file-preview>
                    </span>
                </template>
                <template lwc:if={pdfInitialLoad}>
                    <span style="z-index: 9001 !important;">
                        <c-show-file-preview onclosepreview={closeModal} image-list={imageList} inline={inline}></c-show-file-preview>
                    </span>
                </template>
                <template lwc:elseif={pdfNextLoad}>
                    <span style="z-index: 9001 !important;">
                        <c-show-file-preview onclosepreview={closeModal} image-list={imageList} inline={inline}></c-show-file-preview>
                    </span>
                </template>
            </template>
            <template if:true={isHTMLFile}>
                <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                    class="slds-modal slds-fade-in-open slds-modal_large">
                    <div class="slds-modal__container">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" variant="inverse" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Cancel and close</span>
                        </button>
                        <div class="slds-modal__header">
                            <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">File Preview</h1>
                        </div>
                        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1"
                            style="overflow-x: scroll;">
                            <iframe height="800px" width="100%" src={pageURL} onload={sendDataToVF}></iframe>
                        </div>
                    </div>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
            </template>
        </template>
    </template>
    <template if:true={loading}>
        <lightning-spinner class="slds-is-fixed spinnnertext" variant="brand"
            alternative-text="Loading"></lightning-spinner>
    </template>
</template>
