<template>

    <div class="kyc-page-layout"
         onopendynamiccomponentmodal={handleOpenDynamicComponentModal}
         onintegrationprogressupdate={handleIntegrationProgressUpdate}>

        <!-- ── Loading overlay ────────────────────────────────────────────── -->
        <template if:true={isLoading}>
            <div class="kyc-loading-overlay">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- ══════════════════════════════════════════════════════════════════
             CARD 1 – Current Address KYC  (always visible)
             ══════════════════════════════════════════════════════════════════ -->
        <div class="kyc-card">
            <div class="kyc-card-header">
                <div class="kyc-header-overlay"></div>
                <div class="kyc-header-content">
                    <div class="kyc-header-icon-wrap">
                        <lightning-icon icon-name="utility:file" size="small" class="kyc-header-icon"></lightning-icon>
                    </div>
                    <div class="kyc-header-text">
                        <h1 class="kyc-header-title">Current Address KYC</h1>
                        <p class="kyc-header-subtitle">Capture KYC for current address</p>
                    </div>
                </div>
            </div>
            <div class="kyc-card-body">
                <div class={currentAddressDocsLayoutClass}>
                    <div class="kyc-docs-left">
                        <div class="kyc-fields-grid">

                    <!-- Address Document Type -->
                    <div class="kyc-field-wrap">
                        <div class="kyc-field-cell">
                            <div class="kyc-field-label">
                                Address Document Type
                                <span class="kyc-required-indicator" title="Required">*</span>
                            </div>
                            <div class="kyc-field-value-col">
                                <lightning-combobox
                                    value={addrDocumentType}
                                    label="Address Document Type"
                                    variant="label-hidden"
                                    placeholder="Select document type"
                                    options={addrDocumentTypeOptions}
                                    disabled={isAddrDocumentTypeReadOnly}
                                    onchange={handleAddrDocumentTypeChange}>
                                </lightning-combobox>
                            </div>
                        </div>
                    </div>

                    <!-- CKYC ID (optional, 14-digit numeric) -->
                    <div class="kyc-field-wrap">
                        <div class="kyc-field-cell">
                            <div class="kyc-field-label">CKYC ID</div>
                            <div class="kyc-field-value-col">
                                <lightning-input
                                    type="text"
                                    label="CKYC ID"
                                    variant="label-hidden"
                                    placeholder="14-digit CKYC identifier (optional)"
                                    value={ckycId}
                                    max-length="14"
                                    disabled={isReadOnlyScreen}
                                    onchange={handleCkycIdChange}>
                                </lightning-input>
                            </div>
                        </div>
                    </div>

                    <!-- Side mode picker (hidden for Aadhaar Card) -->
                    <template if:true={showDocumentSideMode}>
                        <div class="kyc-field-wrap kyc-field-wrap-full">
                            <div class="kyc-field-cell">
                                <div class="kyc-field-label">
                                    Upload Mode
                                    <span class="kyc-required-indicator" title="Required">*</span>
                                </div>
                                <div class="kyc-field-value-col">
                                    <div class="kyc-radio-group">
                                        <label class={sideModeFullClass}>
                                            <input type="radio" class="kyc-radio-input"
                                                name="documentSideMode" value="Full"
                                                checked={isSideModeFull}
                                                disabled={isReadOnlyScreen}
                                                onchange={handleDocumentSideModeChange} />
                                            <span class="kyc-radio-circle"></span>
                                            <span class="kyc-radio-text">Full Document</span>
                                        </label>
                                        <label class={sideModeSideClass}>
                                            <input type="radio" class="kyc-radio-input"
                                                name="documentSideMode" value="Side"
                                                checked={isSideModeSide}
                                                disabled={isReadOnlyScreen}
                                                onchange={handleDocumentSideModeChange} />
                                            <span class="kyc-radio-circle"></span>
                                            <span class="kyc-radio-text">Front and Back Upload</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Aadhaar Card path: 3-method verification visual picker. -->
                    <template if:true={showAadhaarVerificationPicker}>
                        <div class="kyc-field-wrap kyc-field-wrap-full">
                            <div class="kyc-field-cell">
                                <div class="kyc-field-label">
                                    Select Aadhaar Verification Method
                                    <span class="kyc-required-indicator" title="Required">*</span>
                                </div>
                                <div class="kyc-aadhaar-tile-grid" role="radiogroup" aria-label="Aadhaar Verification Method">
                                    <template for:each={aadhaarVerificationTiles} for:item="tile">
                                        <button
                                            key={tile.id}
                                            type="button"
                                            class={tile.tileClass}
                                            data-method-id={tile.id}
                                            role="radio"
                                            aria-checked={tile.ariaPressed}
                                            disabled={isReadOnlyScreen}
                                            onclick={handleAadhaarMethodSelect}>
                                            <span class="kyc-aadhaar-tile-icon-wrap">
                                                <lightning-icon icon-name={tile.icon} size="small" alternative-text={tile.label}></lightning-icon>
                                            </span>
                                            <span class="kyc-aadhaar-tile-label">{tile.label}</span>
                                            <span class="kyc-aadhaar-tile-description">{tile.description}</span>
                                            <!--
                                                Tile-corner state stack:
                                                  - Info icon: eKYC OTP Verification in progress. Click "View eKYC Link" for status.
                                                  - Tick pill: any selected tile that isn't yet verified.
                                                  - Verified badge: post-verification, replaces both the
                                                    tick and the info icon (per UX spec).
                                            -->
                                            <template if:true={tile.showInfoIcon}>
                                                <span class="kyc-aadhaar-tile-info"
                                                    tabindex="0"
                                                    role="button"
                                                    aria-label={tile.infoTooltip}
                                                    data-tooltip={tile.infoTooltip}
                                                    onclick={handleTileInfoClick}
                                                    onkeydown={handleTileInfoKeydown}>
                                                    <lightning-icon icon-name="utility:info"
                                                        size="x-small"
                                                        alternative-text="Verification status"></lightning-icon>
                                                </span>
                                            </template>
                                            <template if:true={tile.showCheck}>
                                                <span class="kyc-aadhaar-tile-check" aria-hidden="true">
                                                    <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                                </span>
                                            </template>
                                            <template if:true={tile.showVerifiedPill}>
                                                <span class="kyc-aadhaar-tile-verified-badge" aria-label="Verified">
                                                    <lightning-icon icon-name="utility:success"
                                                        size="x-small"
                                                        alternative-text="Verified"></lightning-icon>
                                                    Verified
                                                </span>
                                            </template>
                                        </button>
                                    </template>
                                </div>
                                <div class="kyc-aadhaar-verify-row">
                                    <template if:true={isAadhaarVerified}>
                                        <span class="kyc-aadhaar-verified-pill">
                                            <lightning-icon icon-name="utility:success" size="x-small"></lightning-icon>
                                            Aadhaar verification completed
                                        </span>
                                    </template>
                                    <template if:false={isAadhaarVerified}>
                                        <button
                                            type="button"
                                            class={aadhaarVerifyButtonClass}
                                            disabled={aadhaarVerifyDisabled}
                                            onclick={handleAadhaarVerifyClick}>
                                            {aadhaarVerifyButtonLabel}
                                        </button>
                                    </template>
                                </div>
                                <template if:true={showAadhaarExpiredBanner}>
                                    <div class="kyc-aadhaar-expired-banner" role="alert">
                                        <lightning-icon icon-name="utility:warning" size="x-small" alternative-text="Warning"></lightning-icon>
                                        <span>
                                            eKYC link expired after 72 hours. You can retry Aadhaar or switch to a different KYC document.
                                        </span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Others path: Verification Method dropdown (Video KYC / Digi Locker). -->
                    <template if:true={showOtherVerificationPicker}>
                        <div class="kyc-field-wrap kyc-field-wrap-full">
                            <div class="kyc-field-cell">
                                <lightning-combobox
                                    label="Verification Method"
                                    placeholder="Select Verification Method"
                                    value={otherVerificationMethod}
                                    options={otherVerificationMethodOptions}
                                    onchange={handleOtherVerificationMethodChange}
                                    disabled={isOtherVerificationDisabled}
                                    required>
                                </lightning-combobox>
                                <div class="kyc-aadhaar-verify-row">
                                    <template if:true={isAadhaarVerified}>
                                        <span class="kyc-aadhaar-verified-pill">
                                            <lightning-icon icon-name="utility:success" size="x-small"></lightning-icon>
                                            Verification completed
                                        </span>
                                    </template>
                                    <template if:false={isAadhaarVerified}>
                                        <button
                                            type="button"
                                            class={aadhaarVerifyButtonClass}
                                            disabled={aadhaarVerifyDisabled}
                                            onclick={handleAadhaarVerifyClick}>
                                            {aadhaarVerifyButtonLabel}
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:true={showProofTogglesStandalone}>
                        <div class={proofTogglesWrapClass}>
                            <div class="kyc-proof-toggles">
                                <div class="kyc-proof-toggle-row">
                                    <span class="kyc-proof-toggle-label">Is this document POA?</span>
                                    <lightning-input
                                        type="toggle"
                                        label="Is this document POA?"
                                        variant="label-hidden"
                                        message-toggle-active="Yes"
                                        message-toggle-inactive="No"
                                        checked={addressProofToggle}
                                        disabled={isReadOnlyScreen}
                                        onchange={handleAddressProofToggleChange}>
                                    </lightning-input>
                                </div>
                                <div class="kyc-proof-toggle-row">
                                    <span class="kyc-proof-toggle-label">Is this document POI?</span>
                                    <lightning-input
                                        type="toggle"
                                        label="Is this document POI?"
                                        variant="label-hidden"
                                        message-toggle-active="Yes"
                                        message-toggle-inactive="No"
                                        checked={identityProofToggle}
                                        disabled={isReadOnlyScreen}
                                        onchange={handleIdentityProofToggleChange}>
                                    </lightning-input>
                                </div>
                            </div>
                        </div>
                    </template>

                        </div>
                    </div>

                    <template if:true={showCurrentDocsRightColumn}>
                    <div class="kyc-docs-right">
                    <!-- Full single-file upload -->
                    <template if:true={showAddressProofUpload}>
                        <div class="kyc-field-wrap kyc-field-wrap-full">
                            <c-kyc-entity-document-panel
                                section-key="addressProof"
                                legend-label="Upload Address Proof"
                                file-title="Upload Address Proof"
                                required
                                suppress-left-column
                                is-read-only={isReadOnlyScreen}
                                upload-disabled={addressProofPanelUploadDisabled}
                                upload-icon-url={chunkyUploadIconUrl}
                                files={addressProofPanelFiles}
                                onuploadrequest={handleAddressProofUploadRequest}
                                onfilepreview={handleCurrentAddressPanelFilePreview}
                                onfiledelete={handleCurrentAddressPanelFileDelete}>
                            </c-kyc-entity-document-panel>
                        </div>
                    </template>

                    <!-- Front + Back two-file upload -->
                    <template if:true={showAddressProofUploadSide}>
                        <div class="kyc-field-wrap kyc-field-wrap-full">
                            <c-kyc-entity-document-panel
                                section-key="addressProofFront"
                                legend-label="Upload Front"
                                file-title="Upload Front"
                                required
                                suppress-left-column
                                is-read-only={isReadOnlyScreen}
                                upload-disabled={addressProofFrontPanelUploadDisabled}
                                upload-icon-url={chunkyUploadIconUrl}
                                files={addressProofFrontPanelFiles}
                                onuploadrequest={handleAddressProofFrontUploadRequest}
                                onfilepreview={handleCurrentAddressPanelFilePreview}
                                onfiledelete={handleCurrentAddressPanelFileDelete}>
                            </c-kyc-entity-document-panel>
                        </div>

                        <div class="kyc-field-wrap kyc-field-wrap-full">
                            <c-kyc-entity-document-panel
                                section-key="addressProofBack"
                                legend-label="Upload Back"
                                file-title="Upload Back"
                                required
                                suppress-left-column
                                is-read-only={isReadOnlyScreen}
                                upload-disabled={addressProofBackPanelUploadDisabled}
                                upload-icon-url={chunkyUploadIconUrl}
                                files={addressProofBackPanelFiles}
                                onuploadrequest={handleAddressProofBackUploadRequest}
                                onfilepreview={handleCurrentAddressPanelFilePreview}
                                onfiledelete={handleCurrentAddressPanelFileDelete}>
                            </c-kyc-entity-document-panel>
                        </div>
                    </template>
                    </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- ══════════════════════════════════════════════════════════════════
             CARD 1.5 – Extracted Document Details (OCR via Einstein)
             Visible while extracting OR once extraction has produced data.
             ══════════════════════════════════════════════════════════════════ -->
        <template if:true={showCurrentStandaloneExtractedDetails}>
            <c-kyc-extracted-details
                is-extracting={isExtractingCurrent}
                selected-kyc-doc={extractedDocType}
                extracted-details={currentExtractedDetails}
                is-read-only={extractedDetailsIsReadOnly}
                address-section-label={extractedDocLabel}
                onextracteddetailschange={handleExtractedDetailsChange}>
            </c-kyc-extracted-details>
        </template>

        <!-- ══════════════════════════════════════════════════════════════════
             CARD 2 – Address Verification
             Visible once an address proof exists (Full file or Front+Back pair)
             ══════════════════════════════════════════════════════════════════ -->
        <template if:true={showAddressVerification}>
            <div class="kyc-card">
                <div class="kyc-card-header">
                    <div class="kyc-header-overlay"></div>
                    <div class="kyc-header-content">
                        <div class="kyc-header-icon-wrap">
                            <lightning-icon icon-name="utility:location" size="small" class="kyc-header-icon"></lightning-icon>
                        </div>
                        <div class="kyc-header-text">
                            <h1 class="kyc-header-title">Address Verification</h1>
                            <p class="kyc-header-subtitle">Confirm address details</p>
                        </div>
                    </div>
                </div>
                <div class="kyc-card-body">
                    <div class="kyc-docs-two-col">
                        <div class="kyc-docs-left">
                            <div class="kyc-fields-grid">

                        <!-- Is Current Address Same As Permanent Address? -->
                        <div class="kyc-field-wrap kyc-field-wrap-full">
                            <div class="kyc-field-cell">
                                <div class="kyc-field-label">Is Current Address Same As Permanent Address?</div>
                                <div class="kyc-field-value-col">
                                    <div class="kyc-radio-group">
                                        <label class="kyc-radio-label">
                                            <input type="radio" class="kyc-radio-input"
                                                name="isCurrentAddrSameAsPermanent" value="Yes"
                                                checked={isCurrentAddrSameAsPermanentYes}
                                                disabled={isReadOnlyScreen}
                                                onchange={handleIsCurrentAddrSameAsPermanentChange} />
                                            <span class="kyc-radio-circle"></span>
                                            <span class="kyc-radio-text">Yes</span>
                                        </label>
                                        <label class="kyc-radio-label">
                                            <input type="radio" class="kyc-radio-input"
                                                name="isCurrentAddrSameAsPermanent" value="No"
                                                checked={isCurrentAddrSameAsPermanentNo}
                                                disabled={isReadOnlyScreen}
                                                onchange={handleIsCurrentAddrSameAsPermanentChange} />
                                            <span class="kyc-radio-circle"></span>
                                            <span class="kyc-radio-text">No</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Is Office Address Same As Current Address? -->
                        <div class="kyc-field-wrap kyc-field-wrap-full">
                            <div class="kyc-field-cell">
                                <div class="kyc-field-label">Is Office Address Same As Current Address?</div>
                                <div class="kyc-field-value-col">
                                    <div class="kyc-radio-group">
                                        <label class="kyc-radio-label">
                                            <input type="radio" class="kyc-radio-input"
                                                name="isOfficeAddrSameAsCurrent" value="Yes"
                                                checked={isOfficeAddrSameAsCurrentYes}
                                                disabled={isReadOnlyScreen}
                                                onchange={handleIsOfficeAddrSameAsCurrentChange} />
                                            <span class="kyc-radio-circle"></span>
                                            <span class="kyc-radio-text">Yes</span>
                                        </label>
                                        <label class="kyc-radio-label">
                                            <input type="radio" class="kyc-radio-input"
                                                name="isOfficeAddrSameAsCurrent" value="No"
                                                checked={isOfficeAddrSameAsCurrentNo}
                                                disabled={isReadOnlyScreen}
                                                onchange={handleIsOfficeAddrSameAsCurrentChange} />
                                            <span class="kyc-radio-circle"></span>
                                            <span class="kyc-radio-text">No</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            </div>
        </div>
        </template>

        <!-- ══════════════════════════════════════════════════════════════════
             SECTION 4 – PERMANENT ADDRESS KYC
             Rendered when isCurrentAddrSameAsPermanent === 'No'.
        ══════════════════════════════════════════════════════════════════ -->
        <template if:true={showPermanentSection}>
            <div class="kyc-card">
                <div class="kyc-card-header">
                    <div class="kyc-header-overlay"></div>
                    <div class="kyc-header-content">
                        <div class="kyc-header-icon-wrap">
                            <lightning-icon icon-name="utility:home" size="small" class="kyc-header-icon"></lightning-icon>
                        </div>
                        <div class="kyc-header-text">
                            <h1 class="kyc-header-title">Permanent Address KYC</h1>
                            <p class="kyc-header-subtitle">Capture KYC for permanent address</p>
                        </div>
                    </div>
                </div>
                <div class="kyc-card-body">
                    <div class={permAddressDocsLayoutClass}>
                        <div class="kyc-docs-left">
                            <div class="kyc-fields-grid">

                        <!-- Address Document Type (picklist filtered by cross-section Aadhaar rule) -->
                        <div class="kyc-field-wrap">
                            <div class="kyc-field-cell">
                                <div class="kyc-field-label">
                                    Address Document Type
                                    <span class="kyc-required-indicator" title="Required">*</span>
                                </div>
                                <div class="kyc-field-value-col">
                                    <lightning-combobox
                                        value={permAddrDocumentType}
                                        label="Address Document Type"
                                        variant="label-hidden"
                                        placeholder="Select document type"
                                        options={permAddrDocumentTypeOptions}
                                        disabled={isPermAddrDocumentTypeReadOnly}
                                        onchange={handlePermAddrDocumentTypeChange}>
                                    </lightning-combobox>
                                </div>
                            </div>
                        </div>

                        <!-- Side mode picker (hidden for Aadhaar Card) -->
                        <template if:true={permShowDocumentSideMode}>
                            <div class="kyc-field-wrap kyc-field-wrap-full">
                                <div class="kyc-field-cell">
                                    <div class="kyc-field-label">
                                        Upload Mode
                                        <span class="kyc-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="kyc-field-value-col">
                                        <div class="kyc-radio-group">
                                            <label class={permSideModeFullClass}>
                                                <input type="radio" class="kyc-radio-input"
                                                    name="permDocumentSideMode" value="Full"
                                                    checked={permIsSideModeFull}
                                                    disabled={isReadOnlyScreen}
                                                    onchange={handlePermDocumentSideModeChange} />
                                                <span class="kyc-radio-circle"></span>
                                                <span class="kyc-radio-text">Full Document</span>
                                            </label>
                                            <label class={permSideModeSideClass}>
                                                <input type="radio" class="kyc-radio-input"
                                                    name="permDocumentSideMode" value="Side"
                                                    checked={permIsSideModeSide}
                                                    disabled={isReadOnlyScreen}
                                                    onchange={handlePermDocumentSideModeChange} />
                                                <span class="kyc-radio-circle"></span>
                                                <span class="kyc-radio-text">Front and Back Upload</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Aadhaar Card path: 3-method verification visual picker. -->
                        <template if:true={permShowAadhaarVerificationPicker}>
                            <div class="kyc-field-wrap kyc-field-wrap-full">
                                <div class="kyc-field-cell">
                                    <div class="kyc-field-label">
                                        Select Aadhaar Verification Method
                                        <span class="kyc-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="kyc-aadhaar-tile-grid" role="radiogroup" aria-label="Permanent Aadhaar Verification Method">
                                        <template for:each={permAadhaarVerificationTiles} for:item="tile">
                                            <button
                                                key={tile.id}
                                                type="button"
                                                class={tile.tileClass}
                                                data-method-id={tile.id}
                                                role="radio"
                                                aria-checked={tile.ariaPressed}
                                                disabled={isReadOnlyScreen}
                                                onclick={handlePermAadhaarMethodSelect}>
                                                <span class="kyc-aadhaar-tile-icon-wrap">
                                                    <lightning-icon icon-name={tile.icon} size="small" alternative-text={tile.label}></lightning-icon>
                                                </span>
                                                <span class="kyc-aadhaar-tile-label">{tile.label}</span>
                                                <span class="kyc-aadhaar-tile-description">{tile.description}</span>
                                                <template if:true={tile.showInfoIcon}>
                                                    <span class="kyc-aadhaar-tile-info"
                                                        tabindex="0"
                                                        role="button"
                                                        aria-label={tile.infoTooltip}
                                                        data-tooltip={tile.infoTooltip}
                                                        onclick={handleTileInfoClick}
                                                        onkeydown={handleTileInfoKeydown}>
                                                        <lightning-icon icon-name="utility:info"
                                                            size="x-small"
                                                            alternative-text="Verification status"></lightning-icon>
                                                    </span>
                                                </template>
                                                <template if:true={tile.showCheck}>
                                                    <span class="kyc-aadhaar-tile-check" aria-hidden="true">
                                                        <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                                    </span>
                                                </template>
                                                <template if:true={tile.showVerifiedPill}>
                                                    <span class="kyc-aadhaar-tile-verified-badge" aria-label="Verified">
                                                        <lightning-icon icon-name="utility:success"
                                                            size="x-small"
                                                            alternative-text="Verified"></lightning-icon>
                                                        Verified
                                                    </span>
                                                </template>
                                            </button>
                                        </template>
                                    </div>
                                    <div class="kyc-aadhaar-verify-row">
                                        <template if:true={permIsAadhaarVerified}>
                                            <span class="kyc-aadhaar-verified-pill">
                                                <lightning-icon icon-name="utility:success" size="x-small"></lightning-icon>
                                                Aadhaar verification completed
                                            </span>
                                        </template>
                                        <template if:false={permIsAadhaarVerified}>
                                            <button
                                                type="button"
                                                class={permAadhaarVerifyButtonClass}
                                                disabled={permAadhaarVerifyDisabled}
                                                onclick={handlePermAadhaarVerifyClick}>
                                                {permAadhaarVerifyButtonLabel}
                                            </button>
                                        </template>
                                    </div>
                                    <template if:true={permShowAadhaarExpiredBanner}>
                                        <div class="kyc-aadhaar-expired-banner" role="alert">
                                            <lightning-icon icon-name="utility:warning" size="x-small" alternative-text="Warning"></lightning-icon>
                                            <span>
                                                eKYC link expired after 72 hours. You can retry Aadhaar or switch to a different KYC document.
                                            </span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Others path: Verification Method dropdown (Video KYC / Digi Locker). -->
                        <template if:true={permShowOtherVerificationPicker}>
                            <div class="kyc-field-wrap kyc-field-wrap-full">
                                <div class="kyc-field-cell">
                                    <lightning-combobox
                                        label="Verification Method"
                                        placeholder="Select Verification Method"
                                        value={permOtherVerificationMethod}
                                        options={permOtherVerificationMethodOptions}
                                        onchange={handlePermOtherVerificationMethodChange}
                                        disabled={isPermOtherVerificationDisabled}
                                        required>
                                    </lightning-combobox>
                                    <div class="kyc-aadhaar-verify-row">
                                        <template if:true={permIsAadhaarVerified}>
                                            <span class="kyc-aadhaar-verified-pill">
                                                <lightning-icon icon-name="utility:success" size="x-small"></lightning-icon>
                                                Verification completed
                                            </span>
                                        </template>
                                        <template if:false={permIsAadhaarVerified}>
                                            <button
                                                type="button"
                                                class={permAadhaarVerifyButtonClass}
                                                disabled={permAadhaarVerifyDisabled}
                                                onclick={handlePermAadhaarVerifyClick}>
                                                {permAadhaarVerifyButtonLabel}
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- POA / POI toggles (Permanent) -->
                        <template if:true={permShowProofTogglesStandalone}>
                            <div class={permProofTogglesWrapClass}>
                                <div class="kyc-proof-toggles">
                                    <div class="kyc-proof-toggle-row">
                                        <span class="kyc-proof-toggle-label">Is this document POA?</span>
                                        <lightning-input
                                            type="toggle"
                                            label="Is this document POA?"
                                            variant="label-hidden"
                                            message-toggle-active="Yes"
                                            message-toggle-inactive="No"
                                            checked={permAddressProofToggle}
                                            disabled={isReadOnlyScreen}
                                            onchange={handlePermAddressProofToggleChange}>
                                        </lightning-input>
                                    </div>
                                    <div class="kyc-proof-toggle-row">
                                        <span class="kyc-proof-toggle-label">Is this document POI?</span>
                                        <lightning-input
                                            type="toggle"
                                            label="Is this document POI?"
                                            variant="label-hidden"
                                            message-toggle-active="Yes"
                                            message-toggle-inactive="No"
                                            checked={permIdentityProofToggle}
                                            disabled={isReadOnlyScreen}
                                            onchange={handlePermIdentityProofToggleChange}>
                                        </lightning-input>
                                    </div>
                                </div>
                            </div>
                        </template>
                            </div>
                        </div>
                        <template if:true={showPermDocsRightColumn}>
                        <div class="kyc-docs-right">
                        <!-- Full single-file upload -->
                        <template if:true={permShowAddressProofUpload}>
                            <div class="kyc-field-wrap kyc-field-wrap-full">
                                <c-kyc-entity-document-panel
                                    section-key="permAddressProof"
                                    legend-label="Upload Address Proof"
                                    file-title="Upload Address Proof"
                                    required
                                    suppress-left-column
                                    is-read-only={isReadOnlyScreen}
                                    upload-disabled={permAddressProofPanelUploadDisabled}
                                    upload-icon-url={chunkyUploadIconUrl}
                                    files={permAddressProofPanelFiles}
                                    onuploadrequest={handlePermAddressProofUploadRequest}
                                    onfilepreview={handlePermAddressPanelFilePreview}
                                    onfiledelete={handlePermAddressPanelFileDelete}>
                                </c-kyc-entity-document-panel>
                            </div>
                        </template>

                        <!-- Front + Back two-file upload -->
                        <template if:true={permShowAddressProofUploadSide}>
                            <div class="kyc-field-wrap kyc-field-wrap-full">
                                <c-kyc-entity-document-panel
                                    section-key="permAddressProofFront"
                                    legend-label="Upload Front"
                                    file-title="Upload Front"
                                    required
                                    suppress-left-column
                                    is-read-only={isReadOnlyScreen}
                                    upload-disabled={permAddressProofFrontPanelUploadDisabled}
                                    upload-icon-url={chunkyUploadIconUrl}
                                    files={permAddressProofFrontPanelFiles}
                                    onuploadrequest={handlePermAddressProofFrontUploadRequest}
                                    onfilepreview={handlePermAddressPanelFilePreview}
                                    onfiledelete={handlePermAddressPanelFileDelete}>
                                </c-kyc-entity-document-panel>
                            </div>

                            <div class="kyc-field-wrap kyc-field-wrap-full">
                                <c-kyc-entity-document-panel
                                    section-key="permAddressProofBack"
                                    legend-label="Upload Back"
                                    file-title="Upload Back"
                                    required
                                    suppress-left-column
                                    is-read-only={isReadOnlyScreen}
                                    upload-disabled={permAddressProofBackPanelUploadDisabled}
                                    upload-icon-url={chunkyUploadIconUrl}
                                    files={permAddressProofBackPanelFiles}
                                    onuploadrequest={handlePermAddressProofBackUploadRequest}
                                    onfilepreview={handlePermAddressPanelFilePreview}
                                    onfiledelete={handlePermAddressPanelFileDelete}>
                                </c-kyc-entity-document-panel>
                            </div>
