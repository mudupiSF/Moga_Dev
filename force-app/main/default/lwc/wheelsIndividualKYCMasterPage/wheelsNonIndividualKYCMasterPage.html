<template>

    <div class="kyc-page-layout">

        <template if:true={isLoading}>
            <div class="kyc-loading-overlay">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- CARD 1 — Upload CIN -->
        <template if:true={showCinSection}>
        <div class="kyc-card">
            <div class="kyc-card-header">
                <div class="kyc-header-overlay"></div>
                <div class="kyc-header-content">
                    <div class="kyc-header-icon-wrap">
                        <lightning-icon icon-name="utility:company" size="small" class="kyc-header-icon"></lightning-icon>
                    </div>
                    <div class="kyc-header-text">
                        <h1 class="kyc-header-title">Upload CIN</h1>
                        <p class="kyc-header-subtitle">Certificate of Incorporation / CIN document</p>
                    </div>
                </div>
            </div>
            <div class="kyc-card-body">
                <c-kyc-entity-document-panel
                    section-key="cin"
                    legend-label="CIN Document"
                    file-title="Upload CIN document"
                    required
                    is-read-only={isReadOnlyScreen}
                    upload-disabled={cinUploadDisabled}
                    upload-icon-url={chunkyUploadIconUrl}
                    files={cinPanelFiles}
                    onuploadrequest={handleEntityPanelUploadRequest}
                    onfilepreview={handleEntityPanelFilePreview}
                    onfiledelete={handleEntityPanelFileDelete}>
                    <div slot="left">
                        <div class="form-fields-grid">
                            <div class="form-field-wrap form-field-wrap--full">
                                    <template if:false={cinFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                CIN#
                                                <span class="kyc-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <template if:true={cinNumberIsPicklist}>
                                                    <lightning-combobox
                                                        data-doc="cin"
                                                        value={cinNumber}
                                                        label="CIN#"
                                                        variant="label-hidden"
                                                        placeholder="Select CIN#"
                                                        options={cinNumberOptions}
                                                        onchange={handleEntityDocNumberChange}>
                                                    </lightning-combobox>
                                                </template>
                                                <template if:false={cinNumberIsPicklist}>
                                                    <lightning-input
                                                        type="text"
                                                        data-doc="cin"
                                                        label="CIN#"
                                                        variant="label-hidden"
                                                        placeholder="Enter CIN#"
                                                        value={cinNumber}
                                                        onchange={handleEntityDocNumberChange}>
                                                    </lightning-input>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={cinFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">CIN#</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{cinNumberDisplay}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                        </div>
                    </div>
                </c-kyc-entity-document-panel>
            </div>
        </div>
        </template>

        <!-- CARD 2 — Upload GST -->
        <template if:true={showGstSection}>
        <div class="kyc-card">
            <div class="kyc-card-header">
                <div class="kyc-header-overlay"></div>
                <div class="kyc-header-content">
                    <div class="kyc-header-icon-wrap">
                        <lightning-icon icon-name="utility:file" size="small" class="kyc-header-icon"></lightning-icon>
                    </div>
                    <div class="kyc-header-text">
                        <h1 class="kyc-header-title">Upload GST</h1>
                        <p class="kyc-header-subtitle">GST registration certificate</p>
                    </div>
                </div>
            </div>
            <div class="kyc-card-body">
                <c-kyc-entity-document-panel
                    section-key="gst"
                    legend-label="GST Document"
                    file-title="Upload GST document"
                    required
                    scrollable-left-pane
                    is-read-only={isReadOnlyScreen}
                    upload-disabled={gstUploadDisabled}
                    upload-icon-url={chunkyUploadIconUrl}
                    files={gstPanelFiles}
                    onuploadrequest={handleEntityPanelUploadRequest}
                    onfilepreview={handleEntityPanelFilePreview}
                    onfiledelete={handleEntityPanelFileDelete}>
                    <div slot="left" class="kyc-scroll-left">
                        <div class="form-fields-grid">
                            <div class="form-field-wrap form-field-wrap--full">
                                    <template if:false={gstFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                GST#
                                                <span class="kyc-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <template if:true={gstNumberIsPicklist}>
                                                    <lightning-combobox
                                                        data-doc="gst"
                                                        value={gstNumber}
                                                        label="GST#"
                                                        variant="label-hidden"
                                                        placeholder="Select GST#"
                                                        options={gstNumberOptions}
                                                        onchange={handleEntityDocNumberChange}>
                                                    </lightning-combobox>
                                                </template>
                                                <template if:false={gstNumberIsPicklist}>
                                                    <lightning-input
                                                        type="text"
                                                        data-doc="gst"
                                                        label="GST#"
                                                        variant="label-hidden"
                                                        placeholder="Enter GST#"
                                                        value={gstNumber}
                                                        onchange={handleEntityDocNumberChange}>
                                                    </lightning-input>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={gstFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">GST#</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{gstNumberDisplay}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-field-wrap form-field-wrap--full">
                                    <template if:false={gstFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                Address Line 1
                                                <span class="kyc-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-input
                                                    type="text"
                                                    data-field="kycAddressLine1"
                                                    label="Address Line 1"
                                                    variant="label-hidden"
                                                    placeholder="Address Line 1"
                                                    value={gstFieldValues.kycAddressLine1}
                                                    onchange={handleGstFieldChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={gstFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">Address Line 1</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{gstAddressLine1Display}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-field-wrap form-field-wrap--full">
                                    <template if:false={gstFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                Address Line 2
                                                <span class="kyc-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-input
                                                    type="text"
                                                    data-field="kycAddressLine2"
                                                    label="Address Line 2"
                                                    variant="label-hidden"
                                                    placeholder="Address Line 2"
                                                    value={gstFieldValues.kycAddressLine2}
                                                    onchange={handleGstFieldChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={gstFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">Address Line 2</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{gstAddressLine2Display}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-field-wrap">
                                    <template if:false={gstFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                Pin Code
                                                <span class="kyc-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-input
                                                    type="text"
                                                    data-field="kycPinCode"
                                                    label="Pin Code"
                                                    variant="label-hidden"
                                                    placeholder="Pin Code"
                                                    value={gstFieldValues.kycPinCode}
                                                    maxlength="6"
                                                    onchange={handleGstFieldChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={gstFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">Pin Code</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{gstPinCodeDisplay}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-field-wrap">
                                    <template if:false={gstFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                State
                                                <span class="kyc-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-input
                                                    type="text"
                                                    label="State"
                                                    variant="label-hidden"
                                                    placeholder="State"
                                                    value={gstFieldValues.state}
                                                    disabled>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={gstFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">State</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{gstStateDisplay}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-field-wrap">
                                    <template if:false={gstFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                District
                                                <span class="kyc-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-combobox
                                                    data-field="district"
                                                    value={gstFieldValues.district}
                                                    label="District"
                                                    variant="label-hidden"
                                                    placeholder="Select District"
                                                    options={gstDistrictOptions}
                                                    onchange={handleGstFieldChange}>
                                                </lightning-combobox>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={gstFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">District</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{gstDistrictDisplay}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-field-wrap">
                                    <template if:false={gstFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                City
                                                <span class="kyc-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-input
                                                    type="text"
                                                    label="City"
                                                    variant="label-hidden"
                                                    placeholder="City"
                                                    value={gstFieldValues.city}
                                                    disabled>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={gstFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">City</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{gstCityDisplay}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                        </div>
                    </div>
                    <div slot="right">
                        <template if:true={hasGstFile}>
                            <div class="kyc-panel-right-field">
                                <template if:false={gstFieldReadOnly}>
                                    <div class="form-field-cell">
                                        <div class="form-field-label">
                                            Is GST your Registered Address?
                                            <span class="form-required-indicator" title="Required">*</span>
                                        </div>
                                        <div class="form-field-value-col">
                                            <div class="form-radio-group">
                                                <label class="form-radio-label">
                                                    <input type="radio" class="form-radio-input"
                                                        name="gstIsRegisteredAddress" value="Yes"
                                                        checked={gstIsRegisteredAddressYes}
                                                        onchange={handleGstIsRegisteredAddressChange} />
                                                    <span class="form-radio-circle"></span>
                                                    <span class="form-radio-text">Yes</span>
                                                </label>
                                                <label class="form-radio-label">
                                                    <input type="radio" class="form-radio-input"
                                                        name="gstIsRegisteredAddress" value="No"
                                                        checked={gstIsRegisteredAddressNo}
                                                        onchange={handleGstIsRegisteredAddressChange} />
                                                    <span class="form-radio-circle"></span>
                                                    <span class="form-radio-text">No</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template if:true={gstFieldReadOnly}>
                                    <div class="form-info-cell">
                                        <div class="form-info-cell-header">
                                            <span class="form-info-label">Is GST your Registered Address?</span>
                                        </div>
                                        <div class="form-info-value-wrap">
                                            <p class="form-info-value">{gstRegisteredAddressDisplay}</p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </c-kyc-entity-document-panel>
            </div>
        </div>
        </template>

        <!-- Registered Address -->
        <template if:true={showRegisteredAddressSection}>
            <div class="kyc-card">
                <div class="kyc-card-header">
                    <div class="kyc-header-overlay"></div>
                    <div class="kyc-header-content">
                        <div class="kyc-header-icon-wrap">
                            <lightning-icon icon-name="utility:home" size="small" class="kyc-header-icon"></lightning-icon>
                        </div>
                        <div class="kyc-header-text">
                            <h1 class="kyc-header-title">Registered Address</h1>
                            <p class="kyc-header-subtitle">Entity registered address details</p>
                        </div>
                    </div>
                </div>
                <div class="kyc-card-body">
                    <c-kyc-entity-document-panel
                        section-key="registered"
                        legend-label={registeredPanelLegendLabel}
                        file-title={registeredPanelFileTitle}
                        required
                        is-read-only={registeredPanelReadOnly}
                        upload-disabled={registeredUploadDisabled}
                        hide-right-column={registeredHideUploadPanel}
                        upload-icon-url={chunkyUploadIconUrl}
                        files={registeredPanelFiles}
                        onuploadrequest={handleEntityPanelUploadRequest}
                        onfilepreview={handleEntityPanelFilePreview}
                        onfiledelete={handleEntityPanelFileDelete}>
                        <div slot="left">
                            <div class="form-fields-grid">
                                <template if:true={isRegisteredAddressReadOnly}>
                                    <div class="form-field-wrap form-field-wrap--full">
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">Address Proof</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">GST</p>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template if:false={isRegisteredAddressReadOnly}>
                                <div class="form-field-wrap form-field-wrap--full">
                                    <template if:true={isReadOnlyScreen}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">Address Proof</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{registeredAddressProofDisplay}</p>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:false={isReadOnlyScreen}>
                                        <template if:true={registeredAddressProofLocked}>
                                            <div class="form-field-cell">
                                                <div class="form-field-label">
                                                    Address Proof
                                                    <span class="form-required-indicator" title="Required">*</span>
                                                </div>
                                                <div class="form-field-value-col">
                                                    <div class="form-info-cell form-info-cell--inline">
                                                        <p class="form-info-value">{registeredAddressProofDisplay}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:false={registeredAddressProofLocked}>
                                            <div class="form-field-cell">
                                                <div class="form-field-label">
                                                    Address Proof
                                                    <span class="form-required-indicator" title="Required">*</span>
                                                </div>
                                                <div class="form-field-value-col">
                                                    <lightning-combobox
                                                        data-scope="registered"
                                                        data-field="addressProof"
                                                        value={registeredAddressFieldValues.addressProof}
                                                        label="Address Proof"
                                                        variant="label-hidden"
                                                        placeholder="Select address proof"
                                                        options={registeredAddressProofOptions}
                                                        disabled={isRegisteredSectionDisabled}
                                                        onchange={handleEntityAddressChange}>
                                                    </lightning-combobox>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                                </template>

                                <div class="form-field-wrap form-field-wrap--full">
                                    <template if:false={registeredAddressFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                Address Line 1
                                                <span class="form-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-input
                                                    type="text"
                                                    data-scope="registered"
                                                    data-field="kycAddressLine1"
                                                    label="Address Line 1"
                                                    variant="label-hidden"
                                                    placeholder="Address Line 1"
                                                    value={registeredAddressFieldValues.kycAddressLine1}
                                                    onchange={handleEntityAddressChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={registeredAddressFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">Address Line 1</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{registeredAddressLine1Display}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-field-wrap form-field-wrap--full">
                                    <template if:false={registeredAddressFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                Address Line 2
                                                <span class="form-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-input
                                                    type="text"
                                                    data-scope="registered"
                                                    data-field="kycAddressLine2"
                                                    label="Address Line 2"
                                                    variant="label-hidden"
                                                    placeholder="Address Line 2"
                                                    value={registeredAddressFieldValues.kycAddressLine2}
                                                    onchange={handleEntityAddressChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={registeredAddressFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">Address Line 2</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{registeredAddressLine2Display}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-field-wrap">
                                    <template if:false={registeredAddressFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                Pin Code
                                                <span class="form-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-input
                                                    type="text"
                                                    data-scope="registered"
                                                    data-field="kycPinCode"
                                                    label="Pin Code"
                                                    variant="label-hidden"
                                                    placeholder="Pin Code"
                                                    value={registeredAddressFieldValues.kycPinCode}
                                                    maxlength="6"
                                                    onchange={handleEntityAddressChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={registeredAddressFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">Pin Code</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{registeredPinCodeDisplay}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-field-wrap">
                                    <template if:false={registeredAddressFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                State
                                                <span class="form-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-input
                                                    type="text"
                                                    label="State"
                                                    variant="label-hidden"
                                                    placeholder="State"
                                                    value={registeredAddressFieldValues.state}
                                                    disabled>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={registeredAddressFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">State</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{registeredStateDisplay}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-field-wrap">
                                    <template if:false={registeredAddressFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                District
                                                <span class="form-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-combobox
                                                    data-scope="registered"
                                                    data-field="district"
                                                    value={registeredAddressFieldValues.district}
                                                    label="District"
                                                    variant="label-hidden"
                                                    placeholder="Select District"
                                                    options={registeredDistrictOptions}
                                                    onchange={handleEntityAddressChange}>
                                                </lightning-combobox>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={registeredAddressFieldReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header">
                                                <span class="form-info-label">District</span>
                                            </div>
                                            <div class="form-info-value-wrap">
                                                <p class="form-info-value">{registeredDistrictDisplay}</p>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="form-field-wrap">
                                    <template if:false={registeredAddressFieldReadOnly}>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">
                                                City
                                                <span class="form-required-indicator" title="Required">*</span>
                                            </div>
                                            <div class="form-field-value-col">
                                                <lightning-input
                                                    type="text"
                                                    label="City"
                                                    variant="label-hidden"
                                                    placeholder="City"
                                                    value={registeredAddressFieldValues.city}
                                                    disabled>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </template>

                        Mandatory Documents
                    </h2>
                    <button type="button"
                        class="kyc-mandatory-docs-modal-close"
                        onclick={handleCloseEntityMandatoryDocsModal}
                        aria-label="Close">&times;</button>
                </header>
                <div class="kyc-mandatory-docs-modal-body">
                    <p class="kyc-mandatory-docs-modal-intro">
                        Upload mandatory and supporting documents as per entity constitution.
                    </p>
                    <ul class="kyc-mandatory-docs-list">
                        <template for:each={entityMandatoryDocListItems} for:item="docItem">
                            <li key={docItem.id} class="kyc-mandatory-docs-list-item kyc-mandatory-docs-list-item--doc">
                                <span class="kyc-mandatory-doc-name">{docItem.name}</span>
                                <template if:true={docItem.isUploaded}>
                                    <span class="kyc-mandatory-doc-check" title="Collected">
                                        <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" alternative-text="Collected"></lightning-icon>
                                    </span>
                                </template>
                            </li>
                        </template>
                        <template if:true={showEntityAdhocDocumentsRow}>
                            <li class="kyc-mandatory-docs-list-item kyc-mandatory-docs-list-item--adhoc">
                                <div class="kyc-mandatory-adhoc-head">
                                    <span class="kyc-mandatory-docs-adhoc-intro">{entityAdhocDocumentsIntro}</span>
                                    <template if:true={entityAdhocGroupSatisfied}>
                                        <span class="kyc-mandatory-doc-check kyc-mandatory-doc-check--group" title="Requirement met">
                                            <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" alternative-text="Requirement met"></lightning-icon>
                                        </span>
                                    </template>
                                </div>
                                <ul class="kyc-mandatory-adhoc-items">
                                    <template for:each={entityAdhocDocItems} for:item="adhocItem">
                                        <li key={adhocItem.id} class="kyc-mandatory-adhoc-item">
                                            <span class="kyc-mandatory-doc-name">{adhocItem.name}</span>
                                            <template if:true={adhocItem.isUploaded}>
                                                <span class="kyc-mandatory-doc-check" title="Collected">
                                                    <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" alternative-text="Collected"></lightning-icon>
                                                </span>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </section>
    </template>

    <template lwc:if={showDarpanMandatoryDocsModal}>
        <section class="kyc-mandatory-docs-modal-overlay"
            role="dialog"
            aria-modal="true"
            aria-labelledby="darpan-mandatory-docs-modal-title"
            onclick={handleDarpanMandatoryDocsModalOverlayClick}>
            <div class="kyc-mandatory-docs-modal" onclick={stopPropagationEntityDv}>
                <header class="kyc-mandatory-docs-modal-header">
                    <h2 id="darpan-mandatory-docs-modal-title" class="kyc-mandatory-docs-modal-title">
                        Darpan Mandatory Documents
                    </h2>
                    <button type="button"
                        class="kyc-mandatory-docs-modal-close"
                        onclick={handleCloseDarpanMandatoryDocsModal}
                        aria-label="Close">&times;</button>
                </header>
                <div class="kyc-mandatory-docs-modal-body">
                    <p class="kyc-mandatory-docs-modal-intro">
                        Upload the mandatory Darpan document(s) based on NPO status and deferral selection.
                    </p>
                    <ul class="kyc-mandatory-docs-list">
                        <template for:each={darpanRequiredListItems} for:item="docItem">
                            <li key={docItem.id} class="kyc-mandatory-docs-list-item kyc-mandatory-docs-list-item--doc">
                                <span class="kyc-mandatory-doc-name">{docItem.name}</span>
                                <template if:true={docItem.isUploaded}>
                                    <span class="kyc-mandatory-doc-check" title="Collected">
                                        <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" alternative-text="Collected"></lightning-icon>
                                    </span>
                                </template>
                            </li>
                        </template>
                        <template if:true={showDarpanAdhocDocumentsRow}>
                            <li class="kyc-mandatory-docs-list-item kyc-mandatory-docs-list-item--adhoc">
                                <div class="kyc-mandatory-adhoc-head">
                                    <span class="kyc-mandatory-docs-adhoc-intro">Upload at least one supporting document from:</span>
                                    <template if:true={darpanAdhocGroupSatisfied}>
                                        <span class="kyc-mandatory-doc-check kyc-mandatory-doc-check--group" title="Requirement met">
                                            <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" alternative-text="Requirement met"></lightning-icon>
                                        </span>
                                    </template>
                                </div>
                                <ul class="kyc-mandatory-adhoc-items">
                                    <template for:each={darpanAdhocItems} for:item="adhocItem">
                                        <li key={adhocItem.id} class="kyc-mandatory-adhoc-item">
                                            <span class="kyc-mandatory-doc-name">{adhocItem.name}</span>
                                            <template if:true={adhocItem.isUploaded}>
                                                <span class="kyc-mandatory-doc-check" title="Collected">
                                                    <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" alternative-text="Collected"></lightning-icon>
                                                </span>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </section>
    </template>

    <template lwc:if={showEntityMagicUpload}>
        <div class="dv-modal-overlay" onmousedown={handleEntityOverlayMouseDown} onclick={handleEntityOverlayClick}>
            <div class="dv-modal" onclick={stopPropagationEntityDv}>
                <div class="dv-modal-head">
                    <span class="dv-modal-title">Advanced Document Upload</span>
                    <button type="button" class="dv-modal-close" onclick={handleEntityMagicUploadClose} title="Close">&#10005;</button>
                </div>
                <div class="dv-modal-body">
                    <c-embed-custom-file-upload
                        record-id={entityActiveUploadChecklistId}
                        max-files-allowed={entityActiveMaxFiles}
                        allowed-extensions={entityActiveAllowedTypes}
                        enable-compression
                        allow-merge
                        enable-video
                        onfilesuploaded={handleEntityMagicUploadComplete}>
                    </c-embed-custom-file-upload>
                </div>
            </div>
        </div>
    </template>

    <c-embed-document-checklist></c-embed-document-checklist>

</template>
