                                        <div class="form-field-label">No. of attempts</div>

                                            <lightning-input type="number" name="noOfAttempts" label="No. of attempts" variant="label-hidden" value={formData.noOfAttempts} min="0" max="99" step="1" onchange={handleFieldChange}></lightning-input>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div class="form-field-wrap">
                                <template lwc:if={isReadOnly}>
                                    <div class="form-info-cell">
                                        <div class="form-info-cell-header"><span class="form-info-label">FI observation</span></div>
                                        <div class="form-info-value-wrap"><p class="form-info-value">{displayValues.fiObservation}</p></div>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div class="form-field-cell">
                                        <div class="form-field-label">FI observation</div>
                                        <div class="form-field-value-col">
                                            <lightning-combobox name="fiObservation" label="FI observation" variant="label-hidden" value={formData.fiObservation} options={fiObservationOptions} onchange={handleFieldChange}></lightning-combobox>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div class="form-field-wrap">
                                <template lwc:if={isReadOnly}>
                                    <div class="form-info-cell">
                                        <div class="form-info-cell-header"><span class="form-info-label">FI recommendation</span></div>
                                        <div class="form-info-value-wrap"><p class="form-info-value">{formData.fiRecommendation}</p></div>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div class="form-field-cell">
                                        <div class="form-field-label">FI recommendation</div>
                                        <div class="form-field-value-col">
                                            <lightning-input name="fiRecommendation" label="FI recommendation" variant="label-hidden" value={formData.fiRecommendation} onchange={handleFieldChange}></lightning-input>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div class="form-field-wrap">
                                <template lwc:if={isReadOnly}>
                                    <div class="form-info-cell">
                                        <div class="form-info-cell-header"><span class="form-info-label">Verifier remarks</span></div>
                                        <div class="form-info-value-wrap"><p class="form-info-value">{formData.verifierRemarks}</p></div>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div class="form-field-cell">
                                        <div class="form-field-label">Verifier remarks</div>
                                        <div class="form-field-value-col">
                                            <lightning-textarea name="verifierRemarks" label="Verifier remarks" variant="label-hidden" value={formData.verifierRemarks} onchange={handleFieldChange}></lightning-textarea>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <template lwc:if={showRejectReason}>
                                <div class="form-field-wrap">
                                    <template lwc:if={isReadOnly}>
                                        <div class="form-info-cell">
                                            <div class="form-info-cell-header"><span class="form-info-label">Reject reason</span></div>
                                            <div class="form-info-value-wrap"><p class="form-info-value">{formData.rejectReason}</p></div>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <div class="form-field-cell">
                                            <div class="form-field-label">Reject reason</div>
                                            <div class="form-field-value-col">
                                                <lightning-input name="rejectReason" label="Reject reason" variant="label-hidden" value={formData.rejectReason} onchange={handleFieldChange}></lightning-input>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </section>

                <section class="form-card" aria-label="FI documents">
                    <div class="form-body">
                        <h2 class="p4-section-title">FI documents</h2>
                        <div class="rfi-doc-fields">
                            <div class="dv-file-card">
                                <span class="dv-file-legend">Signature</span>
                                <p class="dv-file-title">Capture Signature</p>
                                <template lwc:if={documentUi.signature.showUploadBtn}>
                                    <button type="button" class="dv-upload-btn dv-upload-btn--compact"
                                        onclick={handleSignatureUploadClick} title="Capture signature" disabled={isLoading}>
                                        <span class="dv-upload-btn-text">Capture Signature</span>
                                    </button>
                                </template>
                                <template lwc:if={documentUi.signature.showEmptyPlaceholder}>
                                    <p class="dv-file-empty">No signature captured</p>
                                </template>
                                <template lwc:if={documentUi.signature.showUploadedRow}>
                                    <div class="dv-file-row dv-file-row--single">
                                        <div class="dv-file-row-left">
                                            <span class="dv-file-check">
                                                <lightning-icon icon-name="utility:success" size="x-small" variant="inverse"
                                                    alternative-text="Uploaded"></lightning-icon>
                                            </span>
                                            <div class="dv-file-meta">
                                                <span class="dv-file-name">{documentUi.fileNames.signature}</span>
                                                <span class="dv-file-status">Uploaded</span>
                                            </div>
                                        </div>
                                        <div class="dv-file-row-actions">
                                            <button type="button" class="dv-file-action dv-file-action--preview"
                                                data-document-type="FI Signature" onclick={handleDocumentPreviewClick}
                                                title="Preview">
                                                <lightning-icon icon-name="utility:preview" size="x-small"></lightning-icon>
                                            </button>
                                            <template lwc:if={documentUi.signature.showDeleteBtn}>
                                                <button type="button" class="dv-file-action dv-file-action--danger"
                                                    data-document-type="FI Signature" onclick={handleDocumentDeleteClick}
                                                    title="Delete">
                                                    <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div class="dv-file-card">
                                <span class="dv-file-legend">Residence Image</span>
                                <p class="dv-file-title">Upload Residence Image</p>
                                <template lwc:if={documentUi.residenceFront.showUploadBtn}>
                                    <button type="button" class="dv-upload-btn" data-document-type="Residence Front View"
                                        onclick={handleDocumentUploadClick}
                                        title="Upload residence image" disabled={isLoading}>
                                        <img src={chunkyUploadIconUrl} class="dv-upload-icon" alt="Upload" />
                                        <span class="dv-upload-btn-text">Select Files</span>
                                    </button>
                                </template>
                                <template lwc:if={documentUi.residenceFront.showEmptyPlaceholder}>
                                    <p class="dv-file-empty">No file uploaded</p>
                                </template>
                                <template lwc:if={documentUi.residenceFront.showUploadedRow}>
                                    <div class="dv-file-row dv-file-row--single">
                                        <div class="dv-file-row-left">
                                            <span class="dv-file-check">
                                                <lightning-icon icon-name="utility:success" size="x-small" variant="inverse"
                                                    alternative-text="Uploaded"></lightning-icon>
                                            </span>
                                            <div class="dv-file-meta">
                                                <span class="dv-file-name">{documentUi.fileNames.residenceFront}</span>
                                                <span class="dv-file-status">Uploaded</span>
                                            </div>
                                        </div>
                                        <div class="dv-file-row-actions">
                                            <button type="button" class="dv-file-action dv-file-action--preview"
                                                data-document-type="Residence Front View" onclick={handleDocumentPreviewClick}
                                                title="Preview">
                                                <lightning-icon icon-name="utility:preview" size="x-small"></lightning-icon>
                                            </button>
                                            <template lwc:if={documentUi.residenceFront.showDeleteBtn}>
                                                <button type="button" class="dv-file-action dv-file-action--danger"
                                                    data-document-type="Residence Front View" onclick={handleDocumentDeleteClick}
                                                    title="Delete">
                                                    <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </section>

                <template lwc:if={isAddressProofUploaded}>
                    <section class="form-card" aria-label="Address proof documents">
                        <div class="form-body">
                        <h2 class="p4-section-title">Address proof documents</h2>
                            <div class="rfi-doc-fields">
                        <template for:each={addressProofDocuments} for:item="document">
                            <div key={document.ID} class="dv-file-card">
                                <span class="dv-file-legend">Address Proof</span>
                                <p class="dv-file-title">{document.Name}</p>
                                <div class="dv-file-row dv-file-row--single">
                                    <div class="dv-file-row-left">
                                        <span class="dv-file-check">
                                            <lightning-icon icon-name="utility:success" size="x-small" variant="inverse"
                                                alternative-text="Uploaded"></lightning-icon>
                                        </span>
                                        <div class="dv-file-meta">
                                            <span class="dv-file-name">{document.Name}</span>
                                            <span class="dv-file-status">Uploaded</span>
                                        </div>
                                    </div>
                                    <div class="dv-file-row-actions">
                                        <button type="button" class="dv-file-action dv-file-action--preview"
                                            data-docid={document.ID} onclick={handleAddressProofPreview} title="Preview">
                                            <lightning-icon icon-name="utility:preview" size="x-small"></lightning-icon>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                            </div>
                        </div>
                    </section>
                </template>
                </template>
            </div>
        </div>

        <template lwc:if={uiFlags.showFooter}>
            <div class="form-footer-wrapper">
                <div class="form-footer">
                    <div class="form-btn-wrapper">
                        <template lwc:if={uiFlags.showFiActionButtons}>
                            <button type="button" class="p4-secondary-btn" onclick={handleSaveClick}>Save</button>
                            <button type="button" class="form-primary-btn" onclick={handleSubmitClick}
                                disabled={uiFlags.submitDisabled}>Submit</button>
                        </template>
                        <template lwc:if={uiFlags.showDecisionButtons}>
                            <button type="button" class="p4-secondary-btn" onclick={handleSaveDecisionClick}>Save decision</button>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <template lwc:if={showSignatureModal}>
        <section role="dialog" tabindex="-1" class="rfi-modal-backdrop">
            <div class="rfi-modal rfi-modal--signature">
                <header class="rfi-modal-header">
                    <h2 class="rfi-modal-title">Capture signature</h2>
                    <button type="button" class="rfi-modal-close" title="Close"
                        onclick={handleCloseSignatureModal}>?</button>
                </header>
                <div class="rfi-modal-body">
                    <c-capture-signature documentid={signatureDocumentId}
                        onsignaturecapture={handleSignatureCapture}></c-capture-signature>
                </div>
                <footer class="rfi-modal-footer rfi-modal-footer--actions">
                    <button type="button" class="p4-secondary-btn" onclick={handleSignatureClear}>Clear</button>
                    <button type="button" class="form-primary-btn" onclick={handleSignatureSave}>Save</button>
                </footer>
            </div>
        </section>
    </template>

    <template lwc:if={showMagicUpload}>
        <div class="dv-modal-overlay" onmousedown={handleOverlayMouseDown} onclick={handleOverlayClick}>
            <div class="dv-modal" onclick={stopPropagationDv}>
                <div class="dv-modal-head">
                    <span class="dv-modal-title">Advanced Document Upload</span>
                    <button type="button" class="dv-modal-close" onclick={handleMagicUploadClose} title="Close">&#10005;</button>
                </div>
                <div class="dv-modal-body">
                    <c-embed-custom-file-upload
                        record-id={activeUploadChecklistId}
                        max-files-allowed={activeMaxFiles}
                        allowed-extensions={activeAllowedTypes}
                        enable-compression
                        allow-merge
                        enable-video
                        onfilesuploaded={handleMagicUploadComplete}>
                    </c-embed-custom-file-upload>
                </div>
            </div>
        </div>
    </template>

    <template lwc:if={showFilePreviewer}>
        <c-embed-file-preview
            content-version-id={previewContentVersionId}
            file-name={previewFileName}
            file-extension={previewFileExtension}
            session-id={sessionId}
            vf-root={vfRoot}
            can-download
            onclose={handleEmbedPreviewClose}>
        </c-embed-file-preview>
    </template>

    <template lwc:if={showPreviewModal}>
        <c-file-previewer content-document-id={previewContentDocumentId} file-type={previewFileType}
            record-id={applicationId} onclose={handleFilePreviewClose}>
        </c-file-previewer>
    </template>
</template>
