        onopendynamiccomponentmodal={handleOpenDynamicComponentModal}

                <span class="bmp-loading-overlay-text">Loading Basic Details…</span>

                    <!-- Number of Vehicles (readonly — sourced from primary Application_Line_Item__c) -->
                    <template lwc:if={hasNumberOfVehicles}>
                        <div class="bmp-field-wrap">
                            <div class="bmp-info-cell">
                                <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">🚙</span> --><span class="bmp-info-label">Number of Vehicles</span></div>
                                <div class="bmp-info-value-wrap"><p class="bmp-info-value">{numberOfVehicles}</p></div>
                            </div>
                        </div>
                    </template>

                    <!-- Customer Type (editable combobox; drives Application Type) -->
                    <div class="bmp-field-wrap">
                        <template lwc:if={isCustomerTypeEditable}>
                            <div class="bmp-field-cell">
                                <div class="bmp-field-label">
                                    Customer Type
                                    <span class="bmp-required-indicator" title="Required">*</span>
                                </div>
                                <div class="bmp-field-value-col">
                                    <lightning-combobox
                                        id="customerType"
                                        value={customerType}
                                        label="Customer Type"
                                        variant="label-hidden"
                                        options={customerTypeOptions}
                                        placeholder="Select Customer Type"
                                        disabled={isCustomerTypeDisabled}
                                        onchange={handleCustomerTypeChange}>
                                    </lightning-combobox>
                                    <span class="slds-assistive-text" data-section-input data-required="true" data-editable="true" data-value={customerType} aria-hidden="true"></span>
                                </div>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="bmp-info-cell">
                                <div class="bmp-info-cell-header"><!--<span class="bmp-field-emoji">👥</span>--><span class="bmp-info-label">Customer Type</span></div>
                                <div class="bmp-info-value-wrap"><p class="bmp-info-value">{customerType}</p></div>
                            </div>
                        </template>
                    </div>
                    <!-- Applicant Type (Entity Type) — enabled after Application Type is selected -->
                    <template lwc:if={showApplicantEntityTypeField}>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        <!-- <span class="field-emoji info-emoji">📋</span> -->
                                        Applicant Type (Entity Type)
                                        <span class="bmp-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <lightning-combobox
                                            id="applicantEntityType"
                                            value={applicantEntityType}
                                            label="Applicant Type"
                                            variant="label-hidden"
                                            options={applicantEntityTypeOptionsComputed}
                                            placeholder="Select Entity Type"
                                            disabled={isApplicantEntityTypeDisabled}
                                            onchange={handleApplicantEntityTypeChange}>
                                        </lightning-combobox>
                                        <span class="slds-assistive-text" data-section-input data-required="true" data-editable="true" data-value={applicantEntityType} aria-hidden="true"></span>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">📋</span> --><span class="bmp-info-label">Applicant Type (Entity Type)</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{applicantEntityTypeLabel}</p></div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Entity Name — Non-Individual only -->
                    <template lwc:if={isNonIndividualApplicant}>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        <!-- <span class="field-emoji info-emoji">🏢</span> -->
                                        Entity Name
                                        <span class="bmp-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <div class="bmp-editable-input-wrap">
                                            <input type="text"
                                                id="entityName"
                                                class="bmp-input"
                                                data-section-input
                                                data-required="true"
                                                data-editable="true"
                                                value={entityName}
                                                placeholder="Enter entity name"
                                                oninput={handleEntityNameChange} />
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">🏢</span> --><span class="bmp-info-label">Entity Name</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{entityName}</p></div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template lwc:if={showMajorMinorIndustryFields}>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        <!-- <span class="field-emoji info-emoji">🏭</span> -->
                                        Major Industry
                                        <span class="bmp-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <lightning-combobox
                                            id="majorIndustry"
                                            value={majorIndustry}
                                            label="Major Industry"
                                            variant="label-hidden"
                                            options={majorIndustryOptions}
                                            placeholder="Select Major Industry"
                                            onchange={handleMajorIndustryChange}>
                                        </lightning-combobox>
                                        <span class="slds-assistive-text" data-section-input data-required="true" data-editable="true" data-value={majorIndustry} aria-hidden="true"></span>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">🏭</span> --><span class="bmp-info-label">Major Industry</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{majorIndustry}</p></div>
                                </div>
                            </template>
                        </div>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        <!-- <span class="field-emoji info-emoji">🏭</span> -->
                                        Minor Industry
                                        <span class="bmp-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <lightning-combobox
                                            id="minorIndustry"
                                            value={minorIndustry}
                                            label="Minor Industry"
                                            variant="label-hidden"
                                            options={minorIndustryOptionsComputed}
                                            placeholder="Select Minor Industry"
                                            disabled={isMinorIndustryDisabled}
                                            onchange={handleMinorIndustryChange}>
                                        </lightning-combobox>
                                        <span class="slds-assistive-text" data-section-input data-editable="true" data-value={minorIndustry} aria-hidden="true"></span>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">🏭</span> --><span class="bmp-info-label">Minor Industry</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{minorIndustry}</p></div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template lwc:if={showIndustryFields}>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        <!-- <span class="field-emoji info-emoji">🏭</span> -->
                                        Industry Name
                                        <span class="bmp-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <lightning-combobox
                                            id="industryName"
                                            value={industryName}
                                            label="Industry Name"
                                            variant="label-hidden"
                                            options={industryNameOptions}
                                            placeholder="Select Industry Name"
                                            onchange={handleIndustryNameChange}>
                                        </lightning-combobox>
                                        <span class="slds-assistive-text" data-section-input data-required="true" data-editable="true" data-value={industryName} aria-hidden="true"></span>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">🏭</span> --><span class="bmp-info-label">Industry Name</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{industryName}</p></div>
                                </div>
                            </template>
                        </div>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">🏭</span> --><span class="bmp-info-label">Industry Code</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{industryCode}</p></div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">🏭</span> --><span class="bmp-info-label">Industry Code</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{industryCode}</p></div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Segment (Two Wheeler + New only) -->
                    <!--<template lwc:if={showSegmentField}>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">

                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><span class="bmp-info-label">Segment</span></div>

                    <!-- Beneficiary fields — Non-Individual + Beneficiary applicant -->
                    <template lwc:if={showBeneficiaryFields}>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        <!-- <span class="field-emoji info-emoji">👤</span> -->
                                        Beneficial Owner Category
                                        <span class="bmp-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <lightning-combobox
                                            id="beneficialOwnerCategory"
                                            value={beneficialOwnerCategory}
                                            label="Beneficial Owner Category"
                                            variant="label-hidden"
                                            options={beneficialOwnerCategoryOptions}
                                            placeholder="Select an Option"
                                            onchange={handleBeneficialOwnerCategoryChange}>
                                        </lightning-combobox>
                                        <span class="slds-assistive-text" data-section-input data-required="true" data-editable="true" data-value={beneficialOwnerCategory} aria-hidden="true"></span>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">👤</span> --><span class="bmp-info-label">Beneficial Owner Category</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{beneficialOwnerCategoryLabel}</p></div>
                                </div>
                            </template>
                        </div>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        <!-- <span class="field-emoji info-emoji">🔗</span> -->
                                        Relationship with Entity
                                        <span class="bmp-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <lightning-combobox
                                            id="relationshipWithEntity"
                                            value={relationshipWithEntity}
                                            label="Relationship with Entity"
                                            variant="label-hidden"
                                            options={relationshipWithEntityOptions}
                                            placeholder="Select an Option"
                                            onchange={handleRelationshipWithEntityChange}>
                                        </lightning-combobox>
                                        <span class="slds-assistive-text" data-section-input data-required="true" data-editable="true" data-value={relationshipWithEntity} aria-hidden="true"></span>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">🔗</span> --><span class="bmp-info-label">Relationship with Entity</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{relationshipWithEntityLabel}</p></div>
                                </div>
                            </template>
                        </div>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        <!-- <span class="field-emoji info-emoji">🔗</span> -->
                                        Relationship Type
                                        <span class="bmp-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <lightning-combobox
                                            id="relationshipType"
                                            value={relationshipType}
                                            label="Relationship Type"
                                            variant="label-hidden"
                                            options={relationshipTypeOptions}
                                            placeholder="Select an Option"
                                            onchange={handleRelationshipTypeChange}>
                                        </lightning-combobox>
                                        <span class="slds-assistive-text" data-section-input data-required="true" data-editable="true" data-value={relationshipType} aria-hidden="true"></span>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">🔗</span> --><span class="bmp-info-label">Relationship Type</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{relationshipTypeLabel}</p></div>
                                </div>
                            </template>
                        </div>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        <!-- <span class="field-emoji info-emoji">📋</span> -->
                                        POA Holder
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <div class="bmp-editable-input-wrap">
                                            <input type="checkbox"
                                                id="poaHolder"
                                                class="bmp-checkbox"
                                                checked={poaHolder}
                                                onchange={handlePoaHolderChange} />
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">📋</span> --><span class="bmp-info-label">POA Holder</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{poaHolderLabel}</p></div>
                                </div>
                            </template>
                        </div>
                        <div class="bmp-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        <!-- <span class="field-emoji info-emoji">📊</span> -->
                                        Shareholder %
                                        <span class="bmp-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <div class="bmp-editable-input-wrap">
                                            <input type="number"
                                                id="shareHolding"
                                                class="bmp-input"
                                                data-section-input
                                                data-required="true"
                                                data-editable="true"
                                                value={shareHolding}
                                                min="0"
                                                max="100"
                                                step="0.01"
                                                placeholder="Enter percentage"
                                                oninput={handleShareHoldingChange} 
                                                onblur={handleShareHoldingBlur} />
                                            <template lwc:if={hasShareHoldingValidationError}>
                                                <p class="form-field-error">{shareHoldingValidationError}</p>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><!-- <span class="field-emoji info-emoji">📊</span> --><span class="bmp-info-label">Shareholder %</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{shareHoldingDisplay}</p></div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Clone (copy to Guarantor) question: row before Primary, NI Beneficiary only -->
                    <template lwc:if={showCloneApplicantQuestion}>
                        <div class="bmp-field-wrap bmp-field-wrap--full">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        Choose whether to copy this Beneficiary Information to a Guarantor ?
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <div class="bmp-radio-group">
                                            <label class="bmp-radio-label">
                                                <input type="radio" class="bmp-radio-input"
                                                    name="copyToGuarantor" value="Yes"
                                                    checked={isCopyToGuarantorYes}
                                                    onchange={handleCopyToGuarantorChange} />
                                                <span class="bmp-radio-circle"></span>
                                                <span class="bmp-radio-text">Yes</span>
                                            </label>
                                            <label class="bmp-radio-label">
                                                <input type="radio" class="bmp-radio-input"
                                                    name="copyToGuarantor" value="No"
                                                    checked={isCopyToGuarantorNo}
                                                    onchange={handleCopyToGuarantorChange} />
                                                <span class="bmp-radio-circle"></span>
                                                <span class="bmp-radio-text">No</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="bmp-info-cell">
                                    <div class="bmp-info-cell-header"><span class="bmp-info-label">Copy this Beneficiary to a Guarantor</span></div>
                                    <div class="bmp-info-value-wrap"><p class="bmp-info-value">{copyToGuarantorDisplay}</p></div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Primary applicant question (last row of Application Details) -->
                    <template lwc:if={showPrimaryQuestion}>
                        <div class="bmp-field-wrap bmp-field-wrap--full">
                            <template lwc:if={isFieldEditable}>
                                <div class="bmp-field-cell">
                                    <div class="bmp-field-label">
                                        {primaryQuestionLabel}
                                        <span class="bmp-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="bmp-field-value-col">
                                        <div class="bmp-radio-group">
                                            <label class="bmp-radio-label">
                                                <input type="radio" class="bmp-radio-input"
                                                    name="isPrimaryApplicant" value="Yes"
                                                    checked={isPrimaryYes}
                                                    onchange={handlePrimaryChange} />
                                                <span class="bmp-radio-circle"></span>
                                                <span class="bmp-radio-text">Yes</span>
                                            </label>

                                            </div>
                                        </div>
                                        <template lwc:if={isMobileFormatInvalid}>
                                            <p class="form-field-error">{mobileValidationError}</p>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="form-info-cell">
                                    <div class="form-info-cell-header"><span class="form-info-label">Mobile Number</span></div>
                                    <div class="form-info-value-wrap">
                                        <div class="form-info-value-with-action-row">
                                            <p class="form-info-value">{contactNumber}</p>
                                            <span class={contactVerifyInfoActionLabelClass}>{contactVerifyLabel}</span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- ── Email Address (textWithAction — Verify) ── -->
                        <div class="form-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="form-field-cell">
                                    <div class="form-field-label">
                                        Email Address
                                        <span class="form-required-indicator" title="Required">*</span>
                                    </div>
                                    <div class="form-field-value-col">
                                        <div class="form-input-with-action-wrap">
                                            <input type="text" class="form-action-input"
                                                id="email"
                                                data-section-input
                                                data-required="true"
                                                data-editable="true"
                                                value={emailAddress}
                                                placeholder="Enter email"
                                                maxlength="80"
                                                oninput={handleEmailInput} />
                                            <div class="form-input-with-action-btn-wrap">
                                                <button type="button" class={emailVerifyActionBtnClass}
                                                    disabled={emailVerifyDisabled}
                                                    onclick={handleEmailVerifyClick}>
                                                    {emailVerifyLabel}
                                                </button>
                                            </div>
                                        </div>
                                        <template lwc:if={isEmailFormatInvalid}>
                                            <p class="form-field-error">{emailValidationError}</p>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="form-info-cell">
                                    <div class="form-info-cell-header"><span class="form-info-label">Email Address</span></div>
                                    <div class="form-info-value-wrap">
                                        <div class="form-info-value-with-action-row">
                                            <p class="form-info-value">{emailAddress}</p>
                                            <span class={emailVerifyInfoActionLabelClass}>{emailVerifyLabel}</span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <!-- END Contact Info -->

        <!-- ══ INTEGRATION PROGRESS MODAL ═══════════════════════════════════ -->
        <template lwc:if={showIntegrationProgressModal}>
            <c-integration-progress-modal
                status={integrationProgressModalStatus}
                header={integrationProgressModalHeader}
                current-stage-index={integrationProgressModalCurrentStageIdx}
                stages={integrationProgressModalStages}
                error-message={integrationProgressModalErrorMessage}
                onclose={handleIntegrationProgressModalClose}
                onretry={handleIntegrationProgressModalRetry}
                ondone={handleIntegrationProgressModalDone}>
            </c-integration-progress-modal>
        </template>
        <!-- END INTEGRATION PROGRESS MODAL -->
        <!-- ══ DYNAMIC COMPONENT MODAL ═══════════════════════════════════ -->
        <template lwc:if={showDynamicComponentModal}>
            <c-dynamic-component-modal
                component-name={dynamicComponentName}
                modal-header={dynamicComponentModalHeader}
                record-id={recordId}
                component-props={dynamicComponentProps}
                onclose={handleDynamicComponentModalClose}>
            </c-dynamic-component-modal>
        </template>

        <!-- ══ Application Consent link modal (same pattern as KYC eKYC link modal) ══ -->
        <template lwc:if={showConsentLinkModal}>
            <section class="kyc-ekyc-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="bmp-consent-link-title">
                <div class="kyc-ekyc-modal">
                    <header class="kyc-ekyc-modal-header">
                        <h2 id="bmp-consent-link-title">Application Consent Link</h2>
                        <button type="button" class="kyc-ekyc-modal-close"
                            onclick={handleCloseConsentLinkModal} aria-label="Close">&times;</button>
                    </header>
                    <div class="kyc-ekyc-modal-body">
                        <p class="kyc-ekyc-modal-intro">
                            {consentLinkIntroText}
                        </p>
                        <div class="kyc-ekyc-link-row">
                            <input type="text" class="kyc-ekyc-link-input" value={consentLinkUrl} readonly />
                            <button type="button" class="kyc-ekyc-link-copy kyc-ekyc-link-copy-icon"
                                onclick={handleCopyConsentLink}
                                title={copyConsentLinkButtonLabel}
                                aria-label={copyConsentLinkButtonLabel}>
                                <lightning-icon icon-name={copyConsentLinkButtonIcon} size="x-small"
                                    alternative-text={copyConsentLinkButtonLabel}></lightning-icon>
                            </button>
                            <a class="kyc-ekyc-link-copy kyc-ekyc-link-copy-icon kyc-ekyc-link-open"
                                href={consentLinkUrl}
                                target="_blank" rel="noopener noreferrer"
                                title="Open link in a new tab"
                                aria-label="Open consent link in a new tab">
                                <lightning-icon icon-name="utility:new_window" size="x-small"
                                    alternative-text="Open link"></lightning-icon>
                            </a>
                        </div>
                        <div class="kyc-ekyc-modal-status">
                            <template lwc:if={isPollingApplicationConsent}>
                                <span class="kyc-ekyc-modal-spinner-wrap">
                                    <lightning-spinner alternative-text="Polling" size="small" variant="brand"></lightning-spinner>
                                </span>
                                <span class="kyc-ekyc-modal-status-text">{consentPollingStatusLabel}</span>
                            </template>
                        </div>
                    </div>
                    <footer class="kyc-ekyc-modal-footer">
                        <button type="button" class="kyc-ekyc-modal-btn-secondary"
                            onclick={handleCloseConsentLinkModal}>Close</button>
                    </footer>
                </div>
            </section>
        </template>
        

        <!-- ══ STICKY FOOTER — CONSENT + NEXT ════════════════════════════════
             Consent is shown for every applicant; it is disabled on read-only
             screens. Next remains editable-only for active Basic Details work. -->
        <template lwc:if={showActionFooter}>
            <div class="form-footer-wrapper">
                <div class="form-footer">
                    <div class="form-btn-wrapper">
                        <button type="button"
                            class={consentButtonClass}
                            onclick={handleConsentClick}
                            disabled={isConsentDisabled}
                            aria-disabled={isConsentDisabled}
                        >
                            <template lwc:if={isConsentReviewButton}>
                                <svg class="form-footer-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </template>
                            {consentButtonLabel}
                        </button>
                        <template lwc:if={isFieldEditable}>
                            <button type="button"
                                class={nextButtonClass}
                                onclick={handleNextButton}
                                disabled={isNextDisabled}
                                aria-disabled={isNextDisabled}
                            >
                                Next
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

    </div>

    <!-- ── File previewer (lazy-mounted on eye-icon click) ────────────────── -->
    <template lwc:if={showFilePreviewer}>
        <c-embed-file-preview
            content-version-id={previewContentVersionId}
            file-name={previewFileName}
            file-extension={previewFileExtension}
            session-id={_sessionId}
            vf-root={_vfRoot}
            can-download
            onclose={handleFilePreviewClose}>
        </c-embed-file-preview>
    </template>

</template>
