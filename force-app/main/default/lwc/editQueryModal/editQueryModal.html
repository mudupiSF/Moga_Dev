<template>
    <lightning-modal-header label="Create Query"></lightning-modal-header>
    <lightning-modal-body>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
        <div class="section-container slds-var-m-bottom_small">
            <div class="section-header slds-theme_shade slds-text-color_default">
                Query Details
            </div>
            <div class="section-details slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-large-size_1-of-2 slds-small-size_1-of-1">
                    <div class="slds-form-element">
                        <label class="slds-form-element__label">
                            Query #
                        </label>
                    </div>
                    <div class="slds-form-element__control">
                        {queryDetails.Name}
                    </div>
                </div>
                <div class="slds-col slds-large-size_1-of-2 slds-small-size_1-of-1">
                    <div class="slds-form-element">
                        <label class="slds-form-element__label">
                            Subject
                        </label>
                    </div>
                    <div class="slds-form-element__control">
                        {queryDetails.Subject}
                    </div>
                </div>
                <div class="slds-col slds-large-size_1-of-2 slds-small-size_1-of-1">
                    <div class="slds-form-element">
                        <label class="slds-form-element__label">
                            Status
                        </label>
                    </div>
                    <div class="slds-form-element__control">
                        <lightning-combobox name="status" value={editStatus} options={editableStatusOptions} onchange={handleStatusChange} placeholder="Select Status" disabled={statusDisabled}></lightning-combobox>
                    </div>
                </div>
            </div>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancel" variant="neutral" onclick={handleCloseModal}></lightning-button>
    </lightning-modal-footer>
</template>
