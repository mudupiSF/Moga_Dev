<template>
    <div class="form-layout dev-layout" role="region" aria-label="CAM details">
        <template lwc:if={errorMessage}>
            <div class="p4-form-error cam-page-error" role="alert">
                <lightning-icon icon-name="utility:error" size="small" class="cam-page-error-icon"></lightning-icon>
                <p>{errorMessage}</p>
            </div>
        </template>

        <template lwc:else>
            <section class="form-card cam-page-section" aria-label="Basic information">
                <div class="form-body">
                    <header class="cam-page-section-head">
                        <span class="cam-page-section-icon" aria-hidden="true">
                            <lightning-icon icon-name="utility:info" size="xx-small"></lightning-icon>
                        </span>
                        <h2 class="p4-section-title cam-page-section-title">Basic Information</h2>
                    </header>
                    <template lwc:if={basicInfoFields.length}>
                        <article class="cam-page-detail-panel">
                            <dl class="cam-page-detail-list cam-page-detail-list-paired">
                                <template for:each={basicInfoFields} for:item="field">
                                    <div key={field.id} class="cam-page-detail-row">
                                        <dt class="cam-page-detail-label">{field.label}</dt>
                                        <dd class="cam-page-detail-value">{field.valueDisplay}</dd>
                                    </div>
                                </template>
                            </dl>
                        </article>
                    </template>
                </div>
            </section>

            <section class="form-card cam-page-section" aria-label="Personal details">
                <div class="form-body">
                    <header class="cam-page-section-head">
                        <span class="cam-page-section-icon" aria-hidden="true">
                            <lightning-icon icon-name="utility:people" size="xx-small"></lightning-icon>
                        </span>
                        <h2 class="p4-section-title cam-page-section-title">Personal Details</h2>
                    </header>
                    <template lwc:if={applicantColumns.length}>
                        <div class="cam-page-cards-panel">
                            <template lwc:if={carouselState.personal.nav.showPagination}>
                                <nav class="cam-page-cards-pagination"
                                    aria-label={carouselState.personal.nav.paginationAriaLabel}>
                                    <button type="button" class="cam-page-pagination-btn" title="Previous page"
                                        data-section="personal" disabled={carouselState.personal.nav.isPrevDisabled}
                                        onclick={handlePaginationPrev} aria-label="Previous page">
                                        <lightning-icon icon-name="utility:chevronleft" size="x-small"
                                            class="cam-page-pagination-btn-icon" aria-hidden="true">
                                        </lightning-icon>
                                    </button>
                                    <span class="cam-page-pagination-label">{carouselState.personal.nav.paginationLabel}</span>
                                    <button type="button" class="cam-page-pagination-btn" title="Next page"
                                        data-section="personal" disabled={carouselState.personal.nav.isNextDisabled}
                                        onclick={handlePaginationNext} aria-label="Next page">
                                        <lightning-icon icon-name="utility:chevronright" size="x-small"
                                            class="cam-page-pagination-btn-icon" aria-hidden="true">
                                        </lightning-icon>
                                    </button>
                                </nav>
                            </template>
                            <div class={carouselState.personal.gridClass}>
                            <template for:each={carouselState.personal.items} for:item="applicant">
                                <article key={applicant.id} class="cam-page-applicant-card">
                                    <div class="cam-page-applicant-head">
                                        <span class={applicant.badgeClass}>{applicant.title}</span>
                                    </div>
                                    <dl class="cam-page-detail-list cam-page-detail-list-paired">
                                        <template for:each={applicant.fields} for:item="field">
                                            <div key={field.id} class="cam-page-detail-row">
                                                <dt class="cam-page-detail-label">{field.label}</dt>
                                                <dd class="cam-page-detail-value">{field.valueDisplay}</dd>
                                            </div>
                                        </template>
                                    </dl>
                                    <div class="cam-page-action-row cam-page-card-actions">
                                        <button type="button"
                                            class="p4-secondary-btn p4-button-text cam-page-kyc-btn"
                                            data-applicant-id={applicant.id}
                                            onclick={handleViewKycClick}>
                                            <lightning-icon icon-name="utility:preview" size="xx-small"
                                                class="cam-page-btn-icon" aria-hidden="true">
                                            </lightning-icon>
                                            <span>{applicant.kycButtonLabel}</span>
                                        </button>
                                    </div>
                                </article>
                            </template>
                        </div>
                        </div>
                    </template>
                    <template lwc:else>
                        <p class="p4-help-text cam-page-empty">No applicant details available.</p>
                    </template>
                </div>
            </section>

            <section class="form-card cam-page-section" aria-label="Bank account details">

                        </span>

                    </header>

                                        <lightning-icon icon-name="utility:chevronright" size="x-small"

                                    </button>
                                </nav>

                            <div class={carouselState.bankAccount.gridClass}>

                    </template>
                    <template lwc:else>
                        <p class="p4-help-text cam-page-empty">No bank account details available.</p>
                    </template>
                </div>

            <template lwc:if={showBusinessDetailsSection}>

                                        <lightning-icon icon-name="utility:chevronleft" size="x-small"

                                            </div>

                                    </dl>

            <section class="form-card cam-page-section" aria-label="Pricing and LTV engine">

                        <span class="cam-page-section-icon" aria-hidden="true">
                            <lightning-icon icon-name="utility:percent" size="xx-small"></lightning-icon>
                        </span>
                        <h2 class="p4-section-title cam-page-section-title">Pricing and LTV Engine</h2>
                        <template lwc:if={pricingLtvSectionCountLabel}>
                            <span class="cam-page-count-badge" title="Asset count">{pricingLtvSectionCountLabel}</span>
                        </template>
                    </header>
                    <template lwc:if={pricingLtvSections.length}>
                        <ul class="cam-loan-asset-list">
                            <template for:each={pricingLtvSections} for:item="asset">

                                    <span class="cam-loan-asset-row-title">{asset.listTitle}</span>
                                    <button type="button" class="cam-loan-asset-btn" title="View pricing and LTV details"
                                        data-section-id={asset.id} data-section-source="pricing" onclick={handleAssetViewClick}>

                                            aria-hidden="true">

                                </li>
                            </template>
                        </ul>

            <section class="form-card cam-page-section" aria-label="Loan details">
                <div class="form-body">
                    <header class="cam-page-section-head">
                        <span class="cam-page-section-icon" aria-hidden="true">
                            <lightning-icon icon-name="utility:money" size="xx-small"></lightning-icon>
                        </span>
                        <h2 class="p4-section-title cam-page-section-title">Loan Details</h2>
                        <template lwc:if={loanSectionCountLabel}>
                            <span class="cam-page-count-badge" title="Asset count">{loanSectionCountLabel}</span>

                    </header>
                    <template lwc:if={loanDetailSections.length}>
                        <ul class="cam-loan-asset-list">
                            <template for:each={loanDetailSections} for:item="asset">
                                <li key={asset.id} class="cam-loan-asset-row">
                                    <span class="cam-loan-asset-row-title">{asset.listTitle}</span>
                                    <button type="button" class="cam-loan-asset-btn" title="View asset details"

                </div>
            </section>

            <section class="form-card cam-page-section" aria-label="Exposure details">
                <div class="form-body">
                    <header class="cam-page-section-head">
                        <span class="cam-page-section-icon" aria-hidden="true">
                            <lightning-icon icon-name="utility:collection_variable" size="xx-small"></lightning-icon>
                        </span>
                        <h2 class="p4-section-title cam-page-section-title">Exposure Details</h2>
                    </header>
                    <template lwc:if={exposureSections.length}>
                        <div class="cam-page-cards-panel">
                            <template lwc:if={carouselState.exposure.nav.showPagination}>
                                <nav class="cam-page-cards-pagination"
                                    aria-label={carouselState.exposure.nav.paginationAriaLabel}>
                                    <button type="button" class="cam-page-pagination-btn" title="Previous page"
                                        data-section="exposure" disabled={carouselState.exposure.nav.isPrevDisabled}
                                        onclick={handlePaginationPrev} aria-label="Previous page">
                                        <lightning-icon icon-name="utility:chevronleft" size="x-small"
                                            class="cam-page-pagination-btn-icon" aria-hidden="true">
                                        </lightning-icon>
                                    </button>
                                    <span class="cam-page-pagination-label">{carouselState.exposure.nav.paginationLabel}</span>
                                    <button type="button" class="cam-page-pagination-btn" title="Next page"
                                        data-section="exposure" disabled={carouselState.exposure.nav.isNextDisabled}
                                        onclick={handlePaginationNext} aria-label="Next page">
                                        <lightning-icon icon-name="utility:chevronright" size="x-small"
                                            class="cam-page-pagination-btn-icon" aria-hidden="true">
                                        </lightning-icon>
                                    </button>
                                </nav>
                            </template>
                            <div class="cam-page-exposure-stack">
                            <template for:each={carouselState.exposure.items} for:item="section">
                                <article key={section.id} class="cam-page-applicant-card cam-page-exposure-card">
                                    <div class="cam-page-applicant-head">
                                        <span class={section.badgeClass}>{section.title}</span>
                                    </div>
                                    <div class="cam-page-exposure-panels">
                                        <section class="cam-page-exposure-panel cam-page-exposure-panel-bank-exposure"
                                            aria-label={section.bankExposurePanelAriaLabel}>
                                            <header class="cam-page-exposure-panel-head">
                                                <span class="cam-page-exposure-panel-icon cam-page-exposure-panel-icon-bank-exposure"
                                                    aria-hidden="true">
                                                    <lightning-icon icon-name="utility:table" size="xx-small">
                                                    </lightning-icon>
                                                </span>
                                                <div class="cam-page-exposure-panel-copy">
                                                    <h3 class="cam-page-exposure-panel-title">{section.bankExposurePanelTitle}</h3>
                                                </div>
                                                <template lwc:if={section.hasRows}>
                                                    <span class="cam-page-exposure-count cam-page-exposure-count-bank-exposure">
                                                        {section.bankExposureCountLabel}
                                                    </span>
                                                </template>
                                            </header>
                                            <div class="master-table-scroll cam-page-exposure-table-wrap">
                                                <table class="master-table cam-page-exposure-table-bank-exposure">
                                                    <thead>
                                                        <tr class="master-table-header-row">
                                                            <th class="master-th-cell" scope="col">Exposure Type</th>
                                                            <th class="master-th-cell" scope="col">Deal Stage</th>
                                                            <th class="master-th-cell" scope="col">Deal No</th>
                                                            <th class="master-th-cell" scope="col">Deal Date</th>
                                                            <th class="master-th-cell" scope="col">Product</th>
                                                            <th class="master-th-cell" scope="col">Status</th>
                                                            <th class="master-th-cell" scope="col">Finance Amount</th>
                                                            <th class="master-th-cell" scope="col">SOH</th>
                                                            <th class="master-th-cell" scope="col">Over Due</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody class="master-table-body">
                                                        <template lwc:if={section.hasRows}>
                                                            <template for:each={section.rows} for:item="row">
                                                                <tr key={row.id} class="master-table-row">
                                                                    <td class="master-td-cell" data-label="Exposure Type">{row.exposureType}</td>
                                                                    <td class="master-td-cell" data-label="Deal Stage">{row.dealStage}</td>
                                                                    <td class="master-td-cell" data-label="Deal No">{row.dealNo}</td>
                                                                    <td class="master-td-cell" data-label="Deal Date">{row.dealDate}</td>
                                                                    <td class="master-td-cell" data-label="Product">{row.product}</td>
                                                                    <td class="master-td-cell" data-label="Status">{row.statusFlag}</td>
                                                                    <td class="master-td-cell" data-label="Finance Amount">{row.financeAmountDisplay}</td>
                                                                    <td class="master-td-cell" data-label="SOH">{row.sohDisplay}</td>
                                                                    <td class="master-td-cell" data-label="Over Due">{row.overDueDisplay}</td>
                                                                </tr>
                                                            </template>
                                                        </template>
                                                        <template lwc:else>
                                                            <tr class="master-table-row">
                                                                <td colspan="9"
                                                                    class="master-td-cell master-table-empty-cell">
                                                                    No exposure records.
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </section>
                                        <section class="cam-page-exposure-panel cam-page-exposure-panel-external-exposure"
                                            aria-label={section.externalExposurePanelAriaLabel}>
                                            <header class="cam-page-exposure-panel-head">
                                                <span class="cam-page-exposure-panel-icon cam-page-exposure-panel-icon-external-exposure"
                                                    aria-hidden="true">
                                                    <lightning-icon icon-name="utility:table" size="xx-small">
                                                    </lightning-icon>
                                                </span>
                                                <div class="cam-page-exposure-panel-copy">
                                                    <h3 class="cam-page-exposure-panel-title">{section.externalExposurePanelTitle}</h3>
                                                </div>
                                                <template lwc:if={section.hasExternalExposureRows}>
                                                    <span class="cam-page-exposure-count cam-page-exposure-count-external-exposure">
                                                        {section.externalExposureCountLabel}
                                                    </span>
                                                </template>
                                            </header>
                                            <div class="master-table-scroll cam-page-exposure-table-wrap">
                                                <table class="master-table cam-page-exposure-table-external-exposure">
                                                    <thead>
                                                        <tr class="master-table-header-row">
                                                            <th class="master-th-cell" scope="col">A/C Type</th>
                                                            <th class="master-th-cell" scope="col">Ownership</th>
                                                            <th class="master-th-cell" scope="col">High Credit</th>
                                                            <th class="master-th-cell" scope="col">Current Balance</th>
                                                            <th class="master-th-cell" scope="col">Overdue</th>
                                                            <th class="master-th-cell" scope="col">Reason for Overdue</th>
                                                            <th class="master-th-cell" scope="col">Financier</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody class="master-table-body">
                                                        <template lwc:if={section.hasExternalExposureRows}>
                                                            <template for:each={section.externalExposureRows} for:item="row">
                                                                <tr key={row.id} class="master-table-row">
                                                                    <td class="master-td-cell" data-label="A/C Type">{row.accountType}</td>
                                                                    <td class="master-td-cell" data-label="Ownership">{row.ownership}</td>
                                                                    <td class="master-td-cell" data-label="High Credit">{row.highCreditDisplay}</td>
                                                                    <td class="master-td-cell" data-label="Current Balance">{row.currentBalanceDisplay}</td>
                                                                    <td class="master-td-cell" data-label="Overdue">{row.amountOverdueDisplay}</td>
                                                                    <td class="master-td-cell" data-label="Reason for Overdue">{row.reasonForOverdue}</td>
                                                                    <td class="master-td-cell" data-label="Financier">{row.financierName}</td>
                                                                </tr>
                                                            </template>
                                                        </template>
                                                        <template lwc:else>
                                                            <tr class="master-table-row">
                                                                <td colspan="7"
                                                                    class="master-td-cell master-table-empty-cell">
                                                                    No external exposure records.
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </section>
                                    </div>
                                </article>
                            </template>
                        </div>
                        </div>
                    </template>
                    <template lwc:else>
                        <p class="p4-help-text cam-page-empty">No exposure details available.</p>
                    </template>
                </div>
            </section>
