<template>
    <div class="form-layout viability-check-wrap">
        <template if:true={isLoading}>
            <div class="form-loading-overlay">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={isCv}>
            <div class="form-card">
                <div class="form-header">
                    <div class="form-header-overlay"></div>
                    <div class="form-header-content">
                        <lightning-icon
                            icon-name="utility:edit_form"
                            size="small"
                            class="slds-icon-text-default"
                            variant="inverse">
                        </lightning-icon>
                        <div class="form-header-text">
                            <h1 class="form-header-title">Viability Check</h1>
                            <p class="form-header-subtitle">Select how you want to calculate viability</p>
                        </div>
                    </div>
                </div>

                <div class="form-body">
                    <div class="form-fields-grid">
                        <div class="form-field-wrap">
                            <template if:true={isReadOnlyMode}>
                                <div class="form-info-cell">
                                    <div class="form-info-cell-header">
                                        <span class="form-info-label">Calculation Basis</span>
                                    </div>
                                    <div class="form-info-value-wrap">
                                        <p class="form-info-value">{calculationBasis}</p>
                                    </div>
                                </div>
                            </template>
                            <template if:false={isReadOnlyMode}>
                                <div class="form-field-cell">
                                    <div class="form-field-label">CALCULATION BASIS <span class="form-required-indicator">*</span></div>
                                    <div class="form-field-value-col">
                                        <lightning-combobox
                                            label="Calculation Basis"
                                            variant="label-hidden"
                                            value={calculationBasis}
                                            options={calculationBasisOptions}
                                            placeholder="Select calculation type"
                                            disabled={isReadOnlyMode}
                                            onchange={handleCalculationBasisChange}>
                                        </lightning-combobox>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <template if:true={showCvBasisHint}>
                <p class="viability-cv-hint slds-m-top_small">Select a Calculation Basis (Hourly or KMS) to show Income and Expense.</p>
            </template>

                                <p class="form-header-subtitle">Update application information</p>
                            </div>
                        </div>
                    </div>
                    <div class="form-body">
                        <div class="form-fields-grid">
                            <div class="form-field-wrap">
                                <template if:true={isReadOnlyMode}>
                                    <div class="form-info-cell">
                                        <div class="form-info-cell-header">
                                            <span class="form-info-label">Asset Deployment</span>
                                        </div>

                                        </div>
                                    </div>
                                </template>

                                        <div class="form-field-value-col">

                                        </div>
                                    </div>
                                </template>

                                <template if:false={isReadOnlyMode}>

                                        <div class="form-field-label">Tax / Cess <span class="form-required-indicator">*</span></div>
                                        <div class="form-field-value-col">

                                        data-key="vehicleRoute"
                                        onchange={handleFieldChange}>
                                    </lightning-input>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="form-field-wrap">
                        <div class="form-info-cell">
                            <div class="form-info-cell-header">
                                <span class="form-info-label">VIABILITY RATIO</span>
                            </div>
                            <div class="form-info-value-wrap">
                                <p class="form-info-value">{viabilityRatioDisplay}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <template if:true={errorMessage}>
                    <div class="slds-text-color_error slds-m-top_small">{errorMessage}</div>
                </template>

                <template if:false={isReadOnlyMode}>
                    <div class="viability-actions slds-m-top_medium">
                        <button
                            type="button"
                            class="p4-secondary-btn p4-button-text"
                            disabled={isLoading}
                            onclick={handleCancel}>
                            Cancel
                        </button>
                        <button
                            type="button"
                            class="p4-primary-btn p4-button-text"
                            disabled={isSaveDisabled}
                            onclick={handleSave}>
                            Save Viability
                        </button>
                    </div>
                </template>
            </div>
        </div>
        </template>

        <template if:true={showIntegrationProgressModal}>
            <c-integration-progress-modal
                status={integrationProgressModalStatus}
                current-stage-index={integrationProgressModalCurrentStageIdx}
                stages={integrationProgressModalStages}
                error-message={integrationProgressModalErrorMessage}
                onclose={handleIntegrationProgressModalClose}
                onretry={handleIntegrationProgressModalRetry}
                ondone={handleIntegrationProgressModalDone}>
            </c-integration-progress-modal>
        </template>
    </div>
</template>
