<template>
    <lightning-card title="PDF File Preview">
        <div class="slds-var-p-around_medium slds-var-p-bottom_small">
            <lightning-input
                type="text"
                label="Content Version Id"
                value={inputContentVersionId}
                onchange={handleContentVersionIdChange}
            >
            </lightning-input>
        </div>

        <template if:true={showPreview}>
            <div class="button-container slds-var-p-horizontal_medium slds-var-p-bottom_small">
                <div class="button-left">
                    <lightning-button
                        label="Previous Page"
                        onclick={handlePreviousPage}
                        disabled={isPreviousDisabled}
                    >
                    </lightning-button>
                </div>
                <div class="button-center">
                    Page {pageNumber}
                </div>
                <div class="button-right">
                    <lightning-button
                        label="Next Page"
                        onclick={handleNextPage}
                    >
                    </lightning-button>
                </div>
            </div>
            <div class="slds-grid slds-grid_align-center">
                <iframe
                    src={previewUrl}
                    class="pdf-frame slds-size_1-of-1"
                    title="PDF Preview"
                >
                </iframe>
            </div>
            <div class="button-container slds-var-p-horizontal_medium slds-var-p-top_small">
                <div class="button-left">
                    <lightning-button
                        label="Previous Page"
                        onclick={handlePreviousPage}
                        disabled={isPreviousDisabled}
                    >
                    </lightning-button>
                </div>
                <div class="button-center">
                    Page {pageNumber}
                </div>
                <div class="button-right">
                    <lightning-button
                        label="Next Page"
                        onclick={handleNextPage}
                    >
                    </lightning-button>
                </div>
            </div>
        </template>

        <template if:true={showInvalidIdMessage}>
            <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium slds-text-color_error">
                Enter a valid ContentVersion Id (starts with 068).
            </div>
        </template>

        <template if:false={hasContentVersionId}>
            <div class="slds-var-p-around_medium">
                Please provide a Content Version Id to preview the file.
            </div>
        </template>
    </lightning-card>
</template>
