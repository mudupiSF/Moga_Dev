<template>
    <div class="video-container">

        <div class="video-header">
            <span class="video-filename" title={fileName}>{fileName}</span>
            <div class="header-actions">
                <button class="toolbar-btn" onclick={handleDownload}>&#8595; Download</button>
                <button class="close-btn"   onclick={handleClose}>&#10005;</button>
            </div>
        </div>

        <div class="video-body">
            <template if:true={errorMsg}>
                <div class="video-error">{errorMsg}</div>
            </template>

            <video width="100%" height="400" controls playsinline>
                <source src={videoUrl} type="video/mp4" />
                Your browser does not support the video tag.
            </video>
        </div>

    </div>
</template>
