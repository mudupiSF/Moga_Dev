                                    </div>
                                    <div class="form-info-value-wrap">
                                        <p class="form-info-value">{reference2AddressLine2}</p>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Reference 2 Pin code -->
                        <div class="form-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="form-field-editable-section">
                                    <label class="form-field-editable-label">Pin code <span class="form-field-required-indicator" title="Required">*</span></label>
                                    <div class="form-field-editable-input-wrap">
                                        <lightning-input
                                            type="text"
                                            value={reference2Pincode}
                                            name="reference2Pincode"
                                            onchange={handleFieldChange}
                                            variant="label-hidden"
                                            disabled={isReadOnlyScreen}>
                                        </lightning-input>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="form-info-cell">
                                    <div class="form-info-cell-header">
                                        <span class="form-info-label">Pin code</span>
                                    </div>
                                    <div class="form-info-value-wrap">
                                        <p class="form-info-value">{reference2Pincode}</p>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Reference 2 City -->
                        <div class="form-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="form-field-editable-section">
                                    <label class="form-field-editable-label">City <span class="form-field-required-indicator" title="Required">*</span></label>
                                    <div class="form-field-editable-input-wrap">
                                        <lightning-input
                                            type="text"
                                            value={reference2City}
                                            name="reference2City"
                                            onchange={handleFieldChange}
                                            variant="label-hidden"
                                            placeholder=""
                                            disabled={isReadOnlyScreen}>
                                        </lightning-input>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="form-info-cell">
                                    <div class="form-info-cell-header">
                                        <span class="form-info-label">City</span>
                                    </div>
                                    <div class="form-info-value-wrap">
                                        <p class="form-info-value">{reference2City}</p>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Reference 2 State -->
                        <div class="form-field-wrap">
                            <template lwc:if={isFieldEditable}>
                                <div class="form-field-editable-section">
                                    <label class="form-field-editable-label">State <span class="form-field-required-indicator" title="Required">*</span></label>
                                    <div class="form-field-editable-input-wrap">
                                        <lightning-input
                                            type="text"
                                            value={reference2State}
                                            name="reference2State"
                                            onchange={handleFieldChange}
                                            variant="label-hidden"
                                            placeholder=""
                                            disabled={isReadOnlyScreen}>
                                        </lightning-input>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="form-info-cell">
                                    <div class="form-info-cell-header">
                                        <span class="form-info-label">State</span>
                                    </div>
                                    <div class="form-info-value-wrap">
                                        <p class="form-info-value">{reference2State}</p>
                                    </div>
                                </div>
                            </template>
                        </div>

                    </div>
                </div>               
            </div>
        </div>
        </template>

        <!-- ══ SECTION 3 — CUSTOMER SIGNATURE CARD ═══════════════════════ -->
        <div class="form-card">
            <div class="form-header">
                <div class="form-header-overlay"></div>
                <div class="form-header-content">
                    <div class="form-header-icon-wrap">
                        <lightning-icon icon-name="utility:edit" size="small" class="form-header-icon"></lightning-icon>
                    </div>
                    <div class="form-header-text">
                        <h1 class="form-header-title">Customer Signature</h1>
                        <p class="form-header-subtitle">Upload customer signature  <span class="form-field-required-indicator" title="Required">*</span></p>
                    </div>
                </div>
            </div>

            <div class="form-body">
                <div class="form-fields-grid">
                    <div class="form-field-wrap">
                        <div class="form-file-upload-wrap">
                            <label class="form-field-editable-label">
                                Customer Signature
                                <span class="form-field-required-indicator" title="Required">*</span>
                            </label>
                            <template lwc:if={signatureUploaded}>
                                <div class="form-file-uploaded-bar">
                                    <lightning-icon
                                        icon-name="utility:success"
                                        size="x-small"
                                        class="form-file-success-icon"
                                        alternative-text="Uploaded">
                                    </lightning-icon>
                                    <p class="form-file-selected-name">{signatureFileName}</p>
                                    <button
                                        type="button"
                                        class="form-file-action-btn"
                                        onclick={handleSignaturePreview}
                                        title="Preview">
                                        <lightning-icon icon-name="utility:preview" size="x-small"></lightning-icon>
                                    </button>
                                    <template lwc:if={showDocumentDelete}>
                                        <button
                                            type="button"
                                            class="form-file-action-btn"
                                            onclick={handleSignatureDelete}
                                            title="Delete">
                                            <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
                                        </button>
                                    </template>
                                </div>
                            </template>
                            <template lwc:else>
                                <template lwc:if={showDocumentActions}>
                                    <lightning-file-upload
                                        record-id={signatureDocumentChecklistId}
                                        accept={signatureAcceptedFormats}
                                        onuploadfinished={handleSignatureUploadFinished}
                                        disabled={isReadOnlyScreen}
                                        label="Customer Signature"
                                        title="Customer Signature"
                                        multiple="false">
                                    </lightning-file-upload>
                                </template>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ══ SECTION — DEMOGRAPHIC REMARKS (OPS view only) ═════════════════ -->
        <template lwc:if={isDemographicOpsView}>
            <div class="form-card">
                <c-operations-section-header
                    subtitle="Verify demographic details and acceptance">
                </c-operations-section-header>

                <div class="form-body">
                    <div class="form-fields-grid">
                        <div class="form-field-wrap">
                            <template lwc:if={isDemographicRemarksEditable}>
                                <div class="form-field-editable-section">
                                    <label class="form-field-editable-label">
                                        Demographic Details Correctly Captured
                                        <span class="form-field-required-indicator" title="Required">*</span>
                                    </label>
                                    <div class="form-field-editable-input-wrap">
                                        <lightning-combobox
                                            name="demographicDetailsCorrectlyCaptured"
                                            value={demographicDetailsCorrectlyCaptured}
                                            options={demographicCorrectlyCapturedOptions}
                                            onchange={handleFieldChange}
                                            variant="label-hidden"
                                            placeholder="Please select">
                                        </lightning-combobox>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="form-info-cell">
                                    <div class="form-info-cell-header">
                                        <span class="form-info-label">Demographic Details Correctly Captured</span>
                                    </div>
                                    <div class="form-info-value-wrap">
                                        <p class="form-info-value">{demographicDetailsCorrectlyCaptured}</p>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div class="form-field-wrap">
                            <template lwc:if={isDemographicRemarksEditable}>
                                <div class="form-field-editable-section">
                                    <label class="form-field-editable-label">
                                        Remarks
                                        <span class="form-field-required-indicator" title="Required">*</span>
                                    </label>
                                    <div class="form-field-editable-input-wrap">
                                        <lightning-textarea
                                            name="remarks"
                                            value={remarks}
                                            onchange={handleFieldChange}
                                            variant="label-hidden"
                                            placeholder="Enter remarks">
                                        </lightning-textarea>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="form-info-cell">
                                    <div class="form-info-cell-header">
                                        <span class="form-info-label">Remarks</span>
                                    </div>
                                    <div class="form-info-value-wrap">
                                        <p class="form-info-value">{remarks}</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- ══ FOOTER — NEXT (disabled via isNextDisabled) ═══════════════════ -->
        <div class="form-footer-wrapper">
            <div class="form-footer">
                <div class="form-btn-wrapper">
                    <button type="button"
                        class="form-primary-btn p4-button-text"
                        onclick={handleNextButton}
                        disabled={isNextDisabled}>
                        Next
                        <lightning-icon
                            icon-name="utility:forward"
                            size="x-small"
                            class="form-btn-icon">
                        </lightning-icon>
                    </button>
                </div>
            </div>
        </div>

        <!-- Document preview overlay for customer signature -->
        <template lwc:if={openPreviewModal}>
            <c-file-previewer
                content-document-id={contentDocumentId}
                file-type={fileType}
                record-id={recordId}
                onclose={handleFilePreviewClose}>
            </c-file-previewer>
        </template>

    </div>
</template>
