<!-- sldsValidatorIgnore -->
<template>
    <section role="dialog" class="slds-modal slds-fade-in-open modal-zindex" tabindex="-1" aria-modal="true"
        aria-labelledby={ariaLabelledBy}>
        <div class={modalContainerClass}>
            <header class="slds-modal__header modal-header-compact">
                <h2 class="slds-modal__title">{modalHeader}</h2>
                <!--<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                    onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="Close" variant="inverse" size="small">
                    </lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>-->
            </header>

            <div class="slds-modal__content modal-content-dynamic">
                <template lwc:if={isConfirmationMode}>
                    <div class="confirmation-body">
                        <h2 id={confirmationTitleId} class="confirmation-title">{confirmationTitle}</h2>
                        <p class="confirmation-message">{confirmationMessage}</p>
                        <div class="confirmation-actions">
                            <template for:each={confirmationButtons} for:item="btn">
                                <lightning-button key={btn.value} label={btn.label} variant={btn.variant}
                                    data-value={btn.value} onclick={handleConfirmationAction} class="confirmation-btn">
                                </lightning-button>
                            </template>
                        </div>
                    </div>
                </template>
                <template lwc:elseif={hasComponent}>
                    <lwc:component
                        lwc:is={componentCtor}
                        record-id={childRecordId}
                        verification-id={childVerificationId}
                        application-id={childApplicationId}
                        applicant-id={childApplicantId}
                        render-as-read-only={childRenderAsReadOnly}
                        data-id="dynamic-child"
                        onclose={handleChildClose}>
                    </lwc:component>
                </template>
                <template lwc:else>
                    <div class="dynamic-modal-loading">
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                        <p>Loading...</p>
                    </div>
                </template>
            </div>
            <div class="slds-modal__footer">
                <lightning-button label="Close" variant="brand" onclick={handleClose} class="dynamic-modal-close"></lightning-button>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
