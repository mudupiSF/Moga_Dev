<template lwc:render-mode="light">
    <template lwc:if={showRenderer}>
    <template lwc:if={loading}>
        <c-custom-spinner size="medium"></c-custom-spinner>
    </template>
    <template lwc:if={vfPageUrl}>
        <iframe id="pdfjs-iframe" class="iframe" width="0" height="0" src={vfPageUrl} title="PDF generator"></iframe>
    </template>
    <template lwc:if={pagedViewer}>

    </template>
    <template lwc:else>
        <div class="slds-page-header">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">

                            <lightning-icon icon-name="doctype:pdf" size="medium"></lightning-icon>
                            <span class="slds-assistive-text">PDF</span>

                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate"
                                            title="Please read the following terms and conditions">Please read the
                                            following
                                            document and sign below</span>
                                    </h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <ul class="slds-button-group-list">
                                <li style="margin: 0 10px;" if:false={hideSignButton}>
                                    <lightning-button variant="brand" label="Sign" title="Sign"
                                        onclick={handleSignDocument}></lightning-button>
                                </li>
                                <li style="margin: 0 10px;" if:false={callingFromVf}>
                                    <lightning-button variant="brand" label="Save" title="Save"
                                        onclick={handleSaveDocument}></lightning-button>
                                </li>
                                <li style="margin: 0 10px;">
                                    <lightning-button variant="brand" label="Submit" title="Submit"
                                        onclick={handleSubmitDocument}></lightning-button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>


        </div>
    </template>
    <template lwc:if={callingFromVf}>
        <template lwc:if={userMessage}>
            <div class="pdf-user-message-container">
                <div class={userMessageClass} role="alert">
                    <span class="pdf-user-message__text">
                        <strong>{userMessage.title}</strong> — {userMessage.message}
                    </span>
                    <button type="button" class="pdf-user-message__close" onclick={clearUserMessage} title="Dismiss">×</button>
                </div>
            </div>
        </template>
    </template>

    <div class="preview-pane" data-id="previewPane">

    </div>


    <template lwc:if={showSignDocumentModal}>

        <div>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="header43"
                class="slds-modal slds-fade-in-open slds-modal_large pdf-sign-modal">
                <div class="slds-modal__container pdf-sign-modal__container">
                    <button class="slds-button slds-button_icon slds-modal__close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" size="large" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Cancel and close</span>
                    </button>
                    <div class="slds-modal__header">
                        <h1 id="header43" class="slds-text-heading_medium">Sign Document</h1>
                    </div>
                    <div class="slds-modal__content slds-grow slds-p-around_medium pdf-sign-modal__content" id="modal-content-id-1">
                        <template lwc:if={hasCurrentSignatureField}>
                            <div class="slds-box slds-m-bottom_small slds-theme_shade">
                                <p class="slds-text-title_caps slds-text-color_weak">{signatureProgressLabel}</p>
                                <p class="slds-text-heading_small slds-m-top_xx-small">
                                    <strong>Label:</strong> {currentSignatureLabel}
                                </p>
                                <template lwc:if={currentSignaturePosition}>
                                    <p class="slds-text-body_small">
                                        <strong>Position:</strong> {currentSignaturePosition}
                                    </p>
                                </template>
                                <template lwc:if={currentSignaturePage}>
                                    <p class="slds-text-body_small">
                                        <strong>Page:</strong> {currentSignaturePage}
                                    </p>
                                </template>
                            </div>
                            <c-signature-p-o-c lwc:ref="signaturePOCComponent" modal-open={signaturePocModalOpen}
                                onsignatureimage={handleSignatureImage}></c-signature-p-o-c>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-heading_small slds-align_absolute-center slds-p-around_medium">
                                All signatures captured.
                            </p>
                        </template>

                    </div>
                    <div class="slds-modal__footer slds-grid slds-grid_align-spread">
                        <lightning-button variant="neutral" label="Cancel" title="Cancel"
                            onclick={handleCloseModal}></lightning-button>
                        <div class="slds-progress slds-progress_shade">
                            <ol class="slds-progress__list">
                                <template for:each={signatureFields} for:item="signatureField">
                                    <template lwc:if={signatureField.completed}>
                                        <li key={signatureField.id} class="slds-progress__item slds-is-completed">
                                            <div class="slds-progress__marker slds-progress__marker_icon" tabindex="0">
                                                <lightning-icon icon-name="utility:success"
                                                    size="xx-small"></lightning-icon>
                                                <span class="slds-assistive-text">{signatureField.signatureValue}</span>
                                            </div>
                                        </li>
                                    </template>
                                    <template lwc:else>
                                        <li key={signatureField.id} class="slds-progress__item slds-is-active">
                                            <div class="slds-progress__marker" tabindex="0">
                                                <span class="slds-assistive-text">{signatureField.signatureValue}</span>
                                            </div>
                                        </li>
                                    </template>
                                </template>
                            </ol>
                            <lightning-progress-bar value={signatureProgress} size="x-small"></lightning-progress-bar>
                        </div>
                        <lightning-button variant="brand" label="Save" title="Save"
                            onclick={handleSignDocumentSave}></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </div>
    </template>
</template>
</template>
